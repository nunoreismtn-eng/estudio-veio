<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#F4F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0D0C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estúdio Veio">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Estúdio Veio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — sidebar rail on desktop, bottom tab bar on phones; one content column of cards; sheets for every focused task. Neutral graphite surfaces, four validated area hues as the only colour. */
:root{
  --page:#F4F3F0; --surface:#FCFCFB; --surface-2:#F0EFEB; --surface-3:#E7E6E1;
  --line:#E1E0D9; --line-2:#CFCEC6; --grid:#E6E5DF;
  --ink:#0E0E0D; --ink-2:#4A4945; --muted:#6B6963; --faint:#9A988F;
  --primary:#0E0E0D; --on-primary:#FCFCFB;
  --voz:#2A78D6; --voz-ink:#1F63B5; --voz-soft:#E3EEFB;
  --historia:#E87BA4; --historia-ink:#B23E6C; --historia-soft:#FBE7EF;
  --social:#6250D6; --social-ink:#5040B8; --social-soft:#ECE9FB;
  --negocio:#1BAF7A; --negocio-ink:#0E7A53; --negocio-soft:#DDF3EA;
  --good:#0CA30C; --warning:#FAB219; --serious:#EC835A; --critical:#D03B3B;
  --good-text:#006300; --bad-text:#B42F2F;
  --good-wash:rgba(12,163,12,.10); --warn-wash:rgba(250,178,25,.18); --bad-wash:rgba(208,59,59,.12);
  --rec:#E5484D; --rec-ink:#FFFFFF;
  --heat-0:#ECEBE6; --heat-1:#CDE2FB; --heat-2:#86B6EF; --heat-3:#3987E5; --heat-4:#1C5CAB;
  --band:rgba(12,163,12,.08);
  --nav-bg:rgba(252,252,251,.84);
  --scrim:rgba(14,14,13,.42);
  --shadow:0 18px 50px rgba(14,14,13,.12), 0 2px 10px rgba(14,14,13,.06);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-ui:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm:10px; --r:14px; --r-lg:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#0D0D0C; --surface:#1A1A19; --surface-2:#232321; --surface-3:#2C2C2A;
  --line:#2C2C2A; --line-2:#3A3A37; --grid:#2A2A28;
  --ink:#F0EFEC; --ink-2:#C3C2B7; --muted:#9C9A91; --faint:#6E6C66;
  --primary:#F0EFEC; --on-primary:#0D0D0C;
  --voz:#3987E5; --voz-ink:#6DA7EC; --voz-soft:#17283D;
  --historia:#D55181; --historia-ink:#EC86AD; --historia-soft:#331A25;
  --social:#9085E9; --social-ink:#ADA4F0; --social-soft:#24213D;
  --negocio:#199E70; --negocio-ink:#46C795; --negocio-soft:#122C22;
  --good-text:#2DBE2D; --bad-text:#F07272;
  --good-wash:rgba(12,163,12,.16); --warn-wash:rgba(250,178,25,.16); --bad-wash:rgba(208,59,59,.2);
  --heat-0:#262624; --heat-1:#17304F; --heat-2:#1F4F86; --heat-3:#2A78D6; --heat-4:#6DA7EC;
  --band:rgba(12,163,12,.12);
  --nav-bg:rgba(26,26,25,.84);
  --scrim:rgba(0,0,0,.6);
  --shadow:0 18px 50px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --page:#0D0D0C; --surface:#1A1A19; --surface-2:#232321; --surface-3:#2C2C2A;
  --line:#2C2C2A; --line-2:#3A3A37; --grid:#2A2A28;
  --ink:#F0EFEC; --ink-2:#C3C2B7; --muted:#9C9A91; --faint:#6E6C66;
  --primary:#F0EFEC; --on-primary:#0D0D0C;
  --voz:#3987E5; --voz-ink:#6DA7EC; --voz-soft:#17283D;
  --historia:#D55181; --historia-ink:#EC86AD; --historia-soft:#331A25;
  --social:#9085E9; --social-ink:#ADA4F0; --social-soft:#24213D;
  --negocio:#199E70; --negocio-ink:#46C795; --negocio-soft:#122C22;
  --good-text:#2DBE2D; --bad-text:#F07272;
  --good-wash:rgba(12,163,12,.16); --warn-wash:rgba(250,178,25,.16); --bad-wash:rgba(208,59,59,.2);
  --heat-0:#262624; --heat-1:#17304F; --heat-2:#1F4F86; --heat-3:#2A78D6; --heat-4:#6DA7EC;
  --band:rgba(12,163,12,.12);
  --nav-bg:rgba(26,26,25,.84);
  --scrim:rgba(0,0,0,.6);
  --shadow:0 18px 50px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
  color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
body.locked{overflow:hidden}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Track identity */
.t-voz{--t:var(--voz);--t-ink:var(--voz-ink);--t-soft:var(--voz-soft)}
.t-historia{--t:var(--historia);--t-ink:var(--historia-ink);--t-soft:var(--historia-soft)}
.t-social{--t:var(--social);--t-ink:var(--social-ink);--t-soft:var(--social-soft)}
.t-negocio{--t:var(--negocio);--t-ink:var(--negocio-ink);--t-soft:var(--negocio-soft)}
.tdot{width:9px;height:9px;border-radius:50%;background:var(--t);display:inline-block;flex:none}

/* Shell */
.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.rail{display:none}
.main{min-width:0;padding-block:14px calc(104px + env(safe-area-inset-bottom, 0px))}
.view{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px;animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  background:var(--nav-bg);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px 2px;color:var(--muted);font-size:.68rem;font-weight:600;letter-spacing:.01em;min-height:52px;border-radius:12px}
.tab .ic{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab-main .bubble{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);margin-top:-18px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tab-main[aria-selected="true"] .bubble{background:var(--rec);color:var(--rec-ink)}
@media (min-width:960px){
  .app{grid-template-columns:230px minmax(0,1fr);gap:36px}
  .rail{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding-block:26px}
  .tabbar{display:none}
  .main{padding-block:30px 56px}
  .view{gap:18px}
}
.brand{display:flex;align-items:center;gap:10px;padding-inline:8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.brand-mark svg{width:22px;height:22px}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:700;letter-spacing:-.01em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:500;margin-top:2px}
.rail-tabs{display:flex;flex-direction:column;gap:2px}
.rail-tab{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:12px;color:var(--ink-2);font-weight:600;font-size:.95rem;text-align:left}
.rail-tab:hover{background:var(--surface-2)}
.rail-tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-inline:8px}
.mode-badge{font-size:.78rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.mode-badge .ic{width:16px;height:16px;margin-top:1px}

/* Page head */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.page-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.75rem, 5vw, 2.35rem);letter-spacing:-.025em;line-height:1.04}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.head-actions{display:flex;align-items:center;gap:8px;flex:none}
.streak{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.9rem}
.streak .ic{color:var(--serious);width:18px;height:18px}
.streak span{font-weight:500;color:var(--muted);font-size:.8rem}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h2,.sec-title{font-family:var(--f-display);font-size:1.16rem;font-weight:650;letter-spacing:-.012em;line-height:1.2}
.sub{color:var(--muted);font-size:.9rem}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.note{font-size:.88rem;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;color:var(--ink-2)}
.empty{color:var(--muted);font-size:.92rem;text-align:center;padding:18px 8px}

/* Buttons and controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:600;font-size:.93rem;min-height:44px;transition:background .15s, border-color .15s, transform .1s}
.btn:hover{border-color:var(--line-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn .ic{width:18px;height:18px}
.icon-btn{width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn[aria-pressed="true"]{color:var(--serious)}
.icon-btn[aria-pressed="true"] .ic{fill:currentColor}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);font-size:.9rem;align-self:flex-start}
.chip-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip-row::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.85rem;white-space:nowrap;flex:none}
.fchip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.fchip.sm{padding:5px 11px;font-size:.8rem}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.lbl{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.01em}
.field{display:flex;flex-direction:column;gap:6px}
input[type="search"],input[type="text"],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;line-height:1.45;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:120px;resize:vertical}
.search{position:relative}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:40px;background:var(--surface)}
.switch{display:flex;align-items:flex-start;gap:10px;font-size:.92rem;cursor:pointer;font-weight:600}
.switch input{width:18px;height:18px;margin-top:3px;accent-color:var(--ink);flex:none}
.switch small{display:block;color:var(--muted);font-size:.82rem;font-weight:400}
.msg{font-size:.88rem;color:var(--muted)}
.msg.err{color:var(--bad-text)}

/* Pills, chips */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--st, var(--faint))}
.pill.good{--st:var(--good);background:var(--good-wash)}
.pill.warn{--st:var(--warning);background:var(--warn-wash)}
.pill.bad{--st:var(--critical);background:var(--bad-wash)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag .ic{width:14px;height:14px}
.tag.track{background:var(--t-soft);color:var(--ink)}
.tag.track .ic{color:var(--t-ink)}
.lv{display:inline-flex;gap:3px;align-items:center}
.lv i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.lv i.on{background:var(--ink-2)}

/* Rings */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .r-track{fill:none;stroke:var(--surface-3)}
.ring .r-val{fill:none;stroke:var(--t, var(--ink));stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring .r-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05}
.ring .r-label b{font-weight:700;font-size:1.05rem}
.ring .r-label small{font-size:.66rem;color:var(--muted);font-weight:600;margin-top:2px}
.ring.lg .r-label b{font-size:2rem;letter-spacing:-.02em}

/* Hoje */
.plan-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.plan-row{width:100%;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left}
.plan-row:hover{border-color:var(--line-2)}
.plan-n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.plan-row.done .plan-n{background:var(--good);color:#fff}
.plan-row.done .ex-title{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted)}
.plan-row .ic.chev{color:var(--faint)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k-label{font-size:.8rem;color:var(--muted);font-weight:600}
.kpi .k-val{font-size:1.75rem;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.kpi .k-val small{font-size:.85rem;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .k-delta{font-size:.78rem;font-weight:600;color:var(--muted)}
.kpi .k-delta.up{color:var(--good-text)} .kpi .k-delta.down{color:var(--bad-text)}
.areas{display:flex;flex-direction:column;gap:4px}
.area-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border:0;background:none;text-align:left;border-radius:12px;width:100%}
.area-row:hover{background:var(--surface-2)}
.area-row .a-name{font-weight:650}
.area-row .a-meta{font-size:.8rem;color:var(--muted)}
.xpbar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:var(--t);border-radius:99px}
.tipcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px}
.tipcard .t-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--t-soft);color:var(--t-ink)}
.tipcard h3{font-size:1rem;font-weight:650}
.tipcard p{color:var(--ink-2);font-size:.92rem;margin-top:2px}
.tip-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty-list{list-style:none;margin:14px 0 6px;padding:0;display:flex;flex-direction:column;gap:12px}
.empty-list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.empty-list .ex-ic{background:var(--surface-2);color:var(--ink)}
.empty-list b{display:block;font-weight:650;font-size:.95rem}
.empty-list .sub{display:block;margin:1px 0 0}

/* Library */
.filters{display:flex;flex-direction:column;gap:10px}
.group-title{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:1.05rem;font-weight:650;margin:10px 2px 4px}
.group-title small{font-family:var(--f-ui);font-size:.8rem;color:var(--muted);font-weight:500}
.subgroup{font-size:.74rem;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 4px 4px}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex-row{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:11px 12px;text-align:left;transition:border-color .15s, transform .1s}
.ex-row:hover{border-color:var(--line-2)}
.ex-row:active{transform:scale(.99)}
.ex-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--t-soft);color:var(--t-ink);flex:none}
.ex-txt{display:flex;flex-direction:column;min-width:0}
.ex-title{font-weight:650;font-size:.97rem;line-height:1.25}
.ex-meta{font-size:.8rem;color:var(--muted);margin-top:2px}
.ex-end{display:flex;align-items:center;gap:10px}
.done-badge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--good-text)}
.done-badge .ic{width:15px;height:15px}
.fav-on{color:var(--serious)}
.gen-card{border:1px dashed var(--line-2);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Detail sheet */
.detail-band{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail-title{font-family:var(--f-display);font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.detail-brief{font-size:1.02rem;line-height:1.55}
.target{margin:0;padding:14px 16px;border-radius:14px;background:var(--t-soft);font-size:1.02rem;line-height:1.6;font-weight:500}
.words3{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.words3 b{font-family:var(--f-display);font-size:1.15rem;padding:6px 14px;border-radius:12px;background:var(--t-soft);font-weight:650}
.steps-prev{list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps-prev li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;font-size:.93rem}
.steps-prev li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.78rem;font-weight:700;color:var(--ink-2)}
.steps-prev small{color:var(--muted);font-family:var(--f-mono);font-size:.75rem;padding-top:2px}
.tipbox{border-left:3px solid var(--t);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:4px}
.tipbox h4{font-size:.78rem;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.why{font-size:.9rem;color:var(--ink-2)}
.sheet-actions{display:flex;gap:10px;align-items:center;position:sticky;bottom:-24px;background:linear-gradient(to top, var(--surface) 70%, transparent);padding:14px 0 6px;margin-top:4px}
.sheet-actions .btn.primary{flex:1}

/* Studio */
.ctx{position:relative;overflow:hidden}
.ctx-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.ctx-top h2{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.ctx-brief{font-size:.98rem}
.ctx-meta{display:flex;gap:8px;flex-wrap:wrap}
.ctx-controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding-top:4px;border-top:1px solid var(--line)}
.ctx-controls .lbl{margin-right:6px}
.levelnote{font-size:.88rem;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.recbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.recbtn{display:inline-flex;align-items:center;gap:12px;border:0;border-radius:999px;padding:14px 24px 14px 16px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:1rem;min-height:56px}
.recbtn .dot{width:22px;height:22px;border-radius:50%;background:var(--rec);flex:none;transition:border-radius .2s}
.recbtn[aria-pressed="true"]{background:var(--rec);color:var(--rec-ink)}
.recbtn[aria-pressed="true"] .dot{border-radius:5px;background:var(--rec-ink);animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.8)}}
.recbtn:disabled{opacity:.6;cursor:wait}
.clock{font-size:1.8rem;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.clock small{font-size:.9rem;color:var(--muted);font-weight:500;margin-left:4px}
.clock.over{color:var(--bad-text)}
.progress{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.progress > i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.progress.over > i{background:var(--warning)}
.live{width:100%;height:150px;display:block;border-radius:14px;background:var(--surface-2)}
.livestats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.livestats div{background:var(--surface-2);border-radius:12px;padding:9px 11px;min-width:0}
.livestats span{display:block;font-size:.74rem;color:var(--muted);font-weight:600}
.livestats b{font-weight:650;font-size:1rem;display:flex;align-items:center;gap:6px;line-height:1.25;overflow-wrap:anywhere}
.livestats b[data-s]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st);flex:none}
.livestats b[data-s="good"]{--st:var(--good)} .livestats b[data-s="warn"]{--st:var(--warning)} .livestats b[data-s="bad"]{--st:var(--critical)}
.livestats b[data-s=""]::before{display:none}
.live-tr{font-size:.95rem;background:var(--surface-2);border-radius:12px;padding:10px 12px;max-height:150px;overflow:auto;overflow-wrap:anywhere}
.live-tr .interim{color:var(--muted)}
mark{color:inherit;border-radius:4px;padding:0 2px}
mark.m-fill{background:var(--bad-wash);box-shadow:inset 0 -2px 0 var(--critical)}
mark.m-hedge{background:var(--warn-wash);box-shadow:inset 0 -2px 0 var(--warning)}
mark.m-sense{background:var(--voz-soft);box-shadow:inset 0 -2px 0 var(--voz)}
mark.m-turn{background:var(--social-soft);box-shadow:inset 0 -2px 0 var(--social)}
mark.m-dial{background:var(--historia-soft);box-shadow:inset 0 -2px 0 var(--historia)}
mark.m-emo{background:var(--warn-wash);box-shadow:inset 0 -2px 0 var(--serious)}
mark.m-play{background:var(--negocio-soft);box-shadow:inset 0 -2px 0 var(--negocio)}
.filerow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.filerow{grid-template-columns:minmax(0,1fr)}}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fname{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.steps{list-style:none;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:.93rem;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.78rem;font-weight:700;color:var(--ink-2)}
details.disc{border-top:1px solid var(--line);padding-top:12px}
details.disc > summary{cursor:pointer;font-weight:650;font-size:.95rem;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.disc > summary::-webkit-details-marker{display:none}
details.disc > summary::after{content:"+";font-weight:500;color:var(--muted);font-size:1.2rem;line-height:1}
details.disc[open] > summary::after{content:"–"}
details.disc > summary small{font-weight:400;color:var(--muted)}

/* Report */
.res-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.res-hero h3{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.res-hero p{color:var(--muted);font-size:.92rem;margin-top:4px}
.hero-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.subtabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subtabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 12px;font-weight:650;font-size:.88rem;color:var(--muted);white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.panel-body{display:flex;flex-direction:column;gap:14px;animation:fade .16s ease-out}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:2px;border-radius:2px;background:var(--k)}
.legend i.box{height:9px;width:12px;border-radius:2px}
.legend .tri{font-size:.62rem;line-height:1}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.metrics{grid-template-columns:minmax(0,1fr)}}
.metric{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.metric .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.metric .name{font-weight:650;font-size:.92rem}
.metric .val{font-size:1.55rem;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.metric .val small{font-size:.78rem;color:var(--muted);margin-left:4px;font-weight:500}
.metric .hint{font-size:.85rem;color:var(--muted)}
.gauge{position:relative;height:8px;border-radius:99px;background:var(--surface-3)}
.gauge .zone{position:absolute;top:0;bottom:0;background:var(--good-wash);box-shadow:inset 0 0 0 1px rgba(12,163,12,.25);border-radius:99px}
.gauge .mark{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-2px);box-shadow:0 0 0 2px var(--surface)}
.gauge .mark.prev{background:var(--faint);height:10px;top:-1px;width:3px}
.gauge-scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.66rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0}
@media (max-width:560px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.facts div{background:var(--surface);padding:10px 12px;min-width:0}
.facts dt{font-size:.74rem;color:var(--muted)}
.facts dd{margin:0;font-weight:650;font-variant-numeric:tabular-nums;font-size:.98rem}
.focus-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.focus-list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.focus-list .f-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2)}
.focus-list .f-ic .ic{width:17px;height:17px}
.focus-list .good .f-ic{background:var(--good-wash);color:var(--good-text)}
.focus-list .fix .f-ic{background:var(--warn-wash);color:var(--ink)}
.focus-list b{display:block;font-weight:650;font-size:.94rem}
.focus-list span{font-size:.88rem;color:var(--ink-2)}
.transcript{font-size:.98rem;line-height:1.75;background:var(--surface-2);border-radius:14px;padding:14px 16px;overflow-wrap:anywhere}
.markers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.markers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.marker{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.marker span{font-size:.76rem;color:var(--muted);font-weight:600}
.marker b{font-size:1.2rem;font-weight:650}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.wtag{font-size:.84rem;padding:4px 10px;border-radius:99px;background:var(--surface-2)}
.wtag b{font-weight:600;margin-left:4px;color:var(--muted)}
.fb{display:flex;flex-direction:column;gap:16px}
.fb .diag{font-size:1.02rem;line-height:1.6}
.scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.scores{grid-template-columns:repeat(3,minmax(0,1fr))}}
.score{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface)}
.score span{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.score b{font-weight:650;font-size:1.1rem}
.h4{font-size:.76rem;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px}
.blist{list-style:none;display:flex;flex-direction:column;gap:9px}
.blist li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;font-size:.94rem}
.blist li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-2);margin-top:8px}
.blist li b{display:block}
.blist li span{color:var(--muted);font-size:.9rem}
.rewrite{font-family:var(--f-display);font-size:1.12rem;line-height:1.5;border-left:3px solid var(--ink);padding-left:14px;font-weight:500}
.drill-box{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.copybox{min-height:150px;font-family:var(--f-mono);font-size:.78rem}
.res-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res-actions .btn{white-space:nowrap}

/* Charts */
.chart{position:relative;display:grid;grid-template-columns:38px minmax(0,1fr);column-gap:8px;row-gap:6px}
.chart .yaxis{position:relative;height:var(--h,170px)}
.chart .yaxis span{position:absolute;right:0;transform:translateY(-50%);font-family:var(--f-mono);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chart .plot{position:relative;height:var(--h,170px);outline-offset:4px;touch-action:pan-y}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.grid-line{position:absolute;left:0;right:0;height:1px;background:var(--grid)}
.grid-line.base{background:var(--line-2)}
.cband{position:absolute;left:0;right:0;background:var(--band)}
.c-line{fill:none;stroke:var(--series, var(--ink));stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--series, var(--ink));opacity:.1}
.c-energy{fill:var(--line-2);opacity:.75}
.c-pause{fill:var(--surface-2)}
.c-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--series, var(--ink));box-shadow:0 0 0 2px var(--surface);transform:translate(-50%,-50%);pointer-events:none}
.c-end{position:absolute;right:0;transform:translate(0,-130%);font-size:.78rem;font-weight:700;background:var(--surface);padding:0 2px;pointer-events:none}
.c-tri{position:absolute;top:-2px;transform:translateX(-50%);font-size:.6rem;line-height:1;pointer-events:none}
.c-tri.down{color:var(--good)} .c-tri.up{color:var(--warning)}
.xaxis{grid-column:2;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.cross{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-2);opacity:.45;pointer-events:none;transform:translateX(-.5px)}
.ctip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;box-shadow:var(--shadow);font-size:.78rem;white-space:nowrap;transform:translate(-50%, calc(-100% - 12px));color:var(--ink-2)}
.ctip b{display:block;font-size:.95rem;color:var(--ink)}
.ctip .k{display:inline-block;width:12px;height:2px;background:var(--series, var(--ink));vertical-align:middle;margin-right:6px}
.chart-table summary{font-size:.82rem;color:var(--muted);font-weight:600;cursor:pointer;margin-top:4px}
.chart-table table{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:8px}
.chart-table th,.chart-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.chart-table td.num,.chart-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.chart-table .wrap-x{overflow-x:auto;max-height:260px;overflow-y:auto}
.multiples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.multiples{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mult{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mult .m-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mult .m-name{font-size:.8rem;font-weight:650}
.mult .m-val{font-size:1.05rem;font-weight:650}
.mult .m-val small{font-size:.72rem;color:var(--muted);font-weight:500;margin-left:2px}
.mult .chart{grid-template-columns:0 minmax(0,1fr);column-gap:0}
.mult .chart .yaxis{visibility:hidden}
.profile{display:flex;flex-direction:column;gap:14px}
.prow{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:14px;align-items:center}
@media (max-width:560px){.prow{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.prow .gauge-wrap{grid-column:1 / -1;order:3}}
.prow .p-name{font-weight:650;font-size:.9rem}
.prow .p-val{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.prow .p-val small{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
.trend.up{color:var(--good-text)} .trend.down{color:var(--bad-text)} .trend.flat{color:var(--muted)}
.heat{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-family:var(--f-mono);font-size:.62rem;color:var(--muted);height:100%}
.heat-days span{display:flex;align-items:center}
.heat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,minmax(0,1fr));grid-auto-columns:minmax(0,1fr);gap:4px}
.hm{aspect-ratio:1;border-radius:4px;background:var(--heat-0);max-width:100%}
.hm.l1{background:var(--heat-1)} .hm.l2{background:var(--heat-2)} .hm.l3{background:var(--heat-3)} .hm.l4{background:var(--heat-4)}
.hm.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hm.today{box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--ink-2)}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);justify-content:flex-end}
.heat-legend .hm{width:11px;height:11px}
.hist{list-style:none;display:flex;flex-direction:column}
.hday{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 4px 4px}
.hrow{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 6px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.hrow:hover{background:var(--surface-2)}
.hrow .h-val{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.hrow .h-val small{display:block;font-size:.7rem;color:var(--muted);font-weight:500}
.banner{font-size:.88rem;background:var(--warn-wash);border-radius:12px;padding:10px 12px;color:var(--ink)}
.ftip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--page);font-size:.78rem;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%, calc(-100% - 8px))}

/* Tools */
.tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.tool-card p{font-size:.88rem;color:var(--muted)}
.tool-card .soon{font-size:.76rem;color:var(--muted);font-weight:600}
.principles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.principles{grid-template-columns:minmax(0,1fr)}}
.princ{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.princ h3{font-size:.97rem;font-weight:650}
.princ p{font-size:.88rem;color:var(--ink-2)}
.princ em{font-size:.86rem;color:var(--muted);font-style:normal;border-left:2px solid var(--t, var(--line-2));padding-left:10px}
.gen{display:flex;flex-direction:column;gap:8px}
.gen-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px}
@media (max-width:480px){.gen-row{grid-template-columns:minmax(0,1fr) auto}.gen-row .lbl{grid-column:1 / -1}}
.gen-row b{font-weight:600;font-size:.97rem}
.frameworks{display:flex;flex-direction:column;gap:8px}
.frameworks details{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.frameworks summary{cursor:pointer;font-weight:650;display:flex;justify-content:space-between;gap:10px;list-style:none}
.frameworks summary::-webkit-details-marker{display:none}
.frameworks summary small{color:var(--muted);font-weight:500}
.frameworks ol{margin-top:10px;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.checklist{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.checklist{grid-template-columns:minmax(0,1fr)}}
.checklist li{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.checklist .ic{width:18px;height:18px;color:var(--good-text);margin-top:2px}
.emo{display:flex;flex-direction:column;gap:10px}
.emo-row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:start}
.emo-row b{font-size:.85rem;padding-top:4px}
.qlist{list-style:none;display:flex;flex-direction:column;gap:8px}
.qlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;font-size:.95rem}
.story-card{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.story-card:hover{border-color:var(--line-2)}
.story-card b{font-weight:650}
.story-card p{font-size:.88rem;color:var(--muted)}
.tuner-face{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.tuner-note{font-family:var(--f-display);font-size:4rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.tuner-hz{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cents{position:relative;width:min(320px,100%);height:10px;border-radius:99px;background:var(--surface-3);margin-top:8px}
.cents .zero{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);transform:translateX(-1px)}
.cents .cmark{position:absolute;top:-3px;width:16px;height:16px;border-radius:50%;background:var(--voz);box-shadow:0 0 0 2px var(--surface);transform:translateX(-50%);left:50%;transition:left .08s linear}
.meter-face{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.meter-val{font-size:3.6rem;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.zone-bar{position:relative;height:16px;border-radius:99px;background:var(--surface-3);overflow:hidden;width:100%}
.zone-bar .zfill{position:absolute;left:0;top:0;bottom:0;background:var(--voz);border-radius:99px;transition:width .06s linear}
.zone-bar .zpeak{position:absolute;top:0;bottom:0;width:3px;background:var(--ink)}
.zone-bar .zsep{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.zone-labels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));font-size:.76rem;color:var(--muted);font-weight:600;text-align:center;margin-top:6px}
.metro{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
.pulse{width:84px;height:84px;border-radius:50%;background:var(--surface-3);transition:transform .08s, background .08s}
.pulse.beat{transform:scale(1.12);background:var(--voz)}
.readtext{font-size:1.05rem;line-height:1.7;background:var(--surface-2);border-radius:14px;padding:14px 16px}

/* Drill / quiz / writing runners */
.run-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:5px;border-radius:99px;background:var(--surface-3)}
.dots i.on{background:var(--ink)}
.dots i.done{background:var(--ink-2);opacity:.5}
.step-text{font-family:var(--f-display);font-size:1.45rem;font-weight:600;line-height:1.3;letter-spacing:-.01em;min-height:3.9em}
.countdown{display:flex;justify-content:center}
.meter-mini{display:flex;flex-direction:column;gap:6px}
.meter-mini .row{justify-content:space-between}
.run-ctrl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:.96rem;display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.opt:hover{border-color:var(--line-2)}
.opt .o-k{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.76rem;font-weight:700;background:var(--surface-2)}
.opt.right{border-color:var(--good);background:var(--good-wash)}
.opt.right .o-k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--critical);background:var(--bad-wash)}
.opt.wrong .o-k{background:var(--critical);color:#fff}
.opt:disabled{cursor:default}
.explain{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:.93rem}
.qtext{font-family:var(--f-display);font-size:1.25rem;font-weight:600;line-height:1.35}
.wcount{display:flex;gap:8px;flex-wrap:wrap}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;padding:4px;color:var(--line-2)}
.stars button .ic{width:30px;height:30px}
.stars button.on{color:var(--warning)}
.stars button.on .ic{fill:currentColor}
.result-big{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 0}
.result-big .rv{font-size:3rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.result-big .rv small{font-size:1rem;color:var(--muted);font-weight:500;margin-left:4px}
.result-lines{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.93rem}
.result-lines li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px}
.result-lines li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-2);margin-top:8px}
.steptable{width:100%;border-collapse:collapse;font-size:.84rem}
.steptable th,.steptable td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.steptable td.num,.steptable th.num{text-align:right;font-variant-numeric:tabular-nums}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:var(--scrim);animation:fadein .2s ease-out}
@keyframes fadein{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:720px;max-height:calc(100% - 28px - env(safe-area-inset-top, 0px));background:var(--surface);border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom, 0px);animation:sheetin .24s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetin{from{transform:translateY(24px);opacity:.4}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:14px max(18px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px));border-bottom:1px solid var(--line);position:relative}
.grab{position:absolute;top:6px;left:50%;width:40px;height:4px;border-radius:2px;background:var(--line-2);transform:translateX(-50%)}
.sheet-title{flex:1;font-weight:650;font-size:1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{overflow-y:auto;padding:18px max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
@media (min-width:760px){ .sheet-wrap{align-items:center;padding:24px} .sheet{border-radius:24px;max-height:min(88vh, 920px)} .grab{display:none} }
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--page);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;animation:fade .2s ease-out}
@media (min-width:960px){.toast{bottom:28px}}
/* phone: no pull-to-refresh while the mic or an exercise runs; tab bar steps aside for the keyboard */
html.live, html.live body{overscroll-behavior-y:contain}
@media (max-width:959px) and (pointer:coarse){ body.typing .tabbar{display:none} body.typing .toast{bottom:calc(16px + env(safe-area-inset-bottom, 0px))} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

</style>

    { q:"Para projetar a voz sem gritar, o principal é…", opts:["Subir o tom","Apoiar na respiração e abrir a boca","Falar mais depressa","Apertar a garganta"], a:1, why:"O volume vem do apoio e da ressonância. O tom deve manter-se perto do teu natural." },
    { q:"Numa má notícia a um cliente, o ritmo ideal é…", opts:["Mais rápido, para despachar","Mais lento e com pausas","Igual ao normal","Arrastado"], a:1, why:"Abrandar transmite controlo e dá tempo ao cliente para processar." },
    { q:"Qual destes hábitos tira mais autoridade?", opts:["Pausas antes de números","Bengalas como “tipo” e “pronto”","Variação de tom","Baixar o volume num momento íntimo"], a:1, why:"As bengalas soam a hesitação. O silêncio no lugar delas soa a pensamento." },
    { q:"O teu tom ótimo encontra-se mais facilmente…", opts:["A gritar","Com um “mm-hmm” descontraído","A imitar um locutor de rádio","No tom mais grave que consegues"], a:1, why:"O “mm-hmm” espontâneo sai perto do tom natural da tua voz, sem esforço." }
  ],
  tip:"Erra à vontade: a explicação de cada resposta é o que conta.", why:"Perceber porque é que algo funciona ajuda-te a repeti-lo sob pressão." },

/* ---------------- HISTÓRIAS ---------------- */
{ id:"gancho", track:"historia", kind:"fala", skill:"Abertura", title:"Gancho em 7 segundos", level:1, seconds:30, focus:"tom",
  brief:"Escolhe uma história tua: uma obra difícil, uma viagem, um erro. Começa-a três vezes, cada uma com um gancho diferente: uma frase de ação, uma frase de diálogo, uma pergunta intrigante. Só os primeiros sete segundos de cada.",
  tip:"Começa no meio da ação. “Eram três da manhã e o camião estava preso na serra” é melhor do que “Então, uma vez…”.",
  why:"Quem ouve decide nos primeiros segundos se vale a pena prestar atenção." },
{ id:"espinha", track:"historia", kind:"fala", skill:"Estrutura", title:"A espinha da história", level:1, seconds:90, focus:"pausas",
  brief:"Conta uma história real com esta espinha: Era uma vez… Todos os dias… Até que um dia… Por causa disso… Por causa disso… Até que finalmente… E desde então…",
  tip:"O “até que um dia” é o motor. Sem ele não há história, há um relato.",
  why:"É a estrutura que se usa nos estúdios de animação para testar ideias: obriga a ter mudança e consequência." },
{ id:"abt", track:"historia", kind:"fala", skill:"Síntese", title:"E, mas, portanto", level:1, seconds:30, focus:"finais",
  brief:"Conta um projeto difícil em três frases: “E…” (o contexto), “Mas…” (o problema), “Portanto…” (o que fizeste e o resultado).",
  tip:"O “mas” tem de doer um pouco. Se não houver risco, não há interesse.",
  why:"O “mas” cria tensão e o “portanto” dá-lhe sentido. É a forma mais curta de uma boa história." },
{ id:"cinco-sentidos", track:"historia", kind:"fala", skill:"Detalhe sensorial", title:"Os cinco sentidos", level:2, seconds:60, focus:"tom",
  brief:"Descreve a primeira vez que entraste numa pedreira, ou um lugar que te marcou, usando pelo menos três sentidos: o que viste, ouviste, cheiraste e sentiste na pele.",
  tip:"Um detalhe sensorial específico vale mais do que cinco adjetivos. “O pó branco nos sapatos” em vez de “era impressionante”.",
  why:"Os sentidos põem quem ouve dentro da cena. Sem eles, a história fica do lado de fora." },
{ id:"mostrar", track:"historia", kind:"fala", skill:"Emoção", title:"Mostrar, não dizer", level:2, seconds:45, focus:"tom",
  brief:"Transmite nervosismo antes de uma apresentação importante sem dizer “nervoso”, “ansioso” ou “medo”. Usa o corpo, os gestos e os pensamentos.",
  tip:"“Li o primeiro slide três vezes e continuava sem saber o que dizia” mostra; “estava nervoso” só informa.",
  why:"Quando mostras, quem ouve sente. Quando nomeias, quem ouve só fica a saber." },
{ id:"reviravolta", track:"historia", kind:"fala", skill:"Reviravolta", title:"Plot twist", level:3, seconds:75, focus:"pausas",
  brief:"Conta uma história em que o final muda o sentido do início. Planta uma pista discreta nos primeiros 15 segundos e revela-a no fim.",
  tip:"A pausa antes da revelação é metade do efeito. Para, deixa o silêncio crescer, e só depois diz.",
  why:"A reviravolta satisfaz quando quem ouve pensa “estava ali o tempo todo”." },
{ id:"silencio-momento", track:"historia", kind:"fala", skill:"Timing", title:"O silêncio antes do momento", level:2, seconds:45, focus:"pausas",
  brief:"Conta uma anedota curta. Antes da frase final, faz uma pausa completa de dois segundos.",
  tip:"Durante a pausa, olha para quem ouve. O silêncio só funciona se o aguentares.",
  why:"A pausa cria expectativa e dá espaço para a frase final aterrar." },
{ id:"duas-vozes", track:"historia", kind:"fala", skill:"Diálogo e personagens", title:"Duas vozes", level:2, seconds:60, focus:"tom",
  brief:"Conta uma discussão entre ti e um cliente exigente, com diálogo direto. Dá a cada personagem uma voz diferente: mais grave, mais aguda, mais lenta.",
  tip:"Diálogo direto (“E ele diz: isto não é o que eu pedi”) é mais vivo do que discurso indireto.",
  why:"Personagens com voz própria fazem a história passar de relato a cena." },
{ id:"erro-ensinou", track:"historia", kind:"fala", skill:"Vulnerabilidade", title:"O erro que me ensinou", level:2, seconds:90, focus:"ritmo",
  brief:"Conta um erro teu: o momento, o que correu mal, o que te custou, o que aprendeste e o que mudaste. Sem te desculpares e sem te diminuíres.",
  tip:"A vulnerabilidade que funciona tem um fim: mostra o que fizeste com o erro.",
  why:"Uma história de vulnerabilidade bem contada cria mais confiança do que dez histórias de sucesso." },
{ id:"regresso", track:"historia", kind:"fala", skill:"Callback", title:"O regresso", level:3, seconds:75, focus:"finais",
  brief:"Abre a história com uma imagem concreta (um objeto, uma frase, um cheiro) e fecha-a com a mesma imagem, agora com outro significado.",
  tip:"Quanto mais simples a imagem, mais forte o regresso. Uma chave, uma mancha, uma palavra.",
  why:"O callback dá à história a sensação de obra fechada, como um círculo que se completa." },
{ id:"comprimir", track:"historia", kind:"fala", skill:"Compressão", title:"Em 15 e em 60 segundos", level:2, seconds:75, focus:"ritmo",
  brief:"Conta a mesma história em 15 segundos e logo a seguir em 60. Na curta, só fica o essencial. Na longa, acrescenta um detalhe sensorial e um momento de tensão.",
  tip:"A versão de 15 segundos revela o esqueleto. Se ela não funciona, a longa também não.",
  why:"Saber comprimir e expandir deixa-te adaptar a história ao tempo e à atenção de quem ouve." },
{ id:"escalada", track:"historia", kind:"fala", skill:"Tensão", title:"Escalada em três", level:2, seconds:75, focus:"dinamica",
  brief:"Conta uma história com três obstáculos, cada um maior do que o anterior, antes da resolução.",
  tip:"Sobe a energia da voz a cada obstáculo e baixa-a na resolução.",
  why:"A regra de três cria ritmo e expectativa. O terceiro obstáculo é o que prende." },
{ id:"origem", track:"historia", kind:"fala", skill:"História de origem", title:"Porque faço o que faço", level:1, seconds:90, focus:"tom",
  brief:"Conta como chegaste à pedra natural e o momento em que deixou de ser só um emprego. Serve para um cliente, para um jantar e para um primeiro encontro.",
  tip:"Escolhe um momento, não uma carreira. Uma tarde na fábrica diz mais do que dez anos resumidos.",
  why:"A história de origem responde à pergunta que todos fazem em silêncio: quem és tu, de verdade?" },
{ id:"viagem-bloco", track:"historia", kind:"fala", skill:"Storytelling de venda", title:"A viagem de um bloco", level:2, seconds:60, focus:"tom",
  brief:"Conta a história de uma laje, da pedreira até à cozinha do cliente, como se fosse uma personagem com uma viagem.",
  tip:"Dá-lhe um momento de risco: o corte, o transporte, a fissura que não apareceu.",
  why:"Um cliente não compra uma laje, compra a história que vai contar aos convidados." },
{ id:"tres-palavras", track:"historia", kind:"fala", skill:"Improviso", title:"Três palavras ao acaso", level:2, seconds:60, focus:"hesitacoes", dyn:"words3",
  brief:"Inventa uma história de 60 segundos que use as três palavras, com princípio, problema e fim.",
  tip:"Decide o final antes de começar. Improvisar com um destino é muito mais fácil.",
  why:"O improviso treina a fluidez: pensar e falar ao mesmo tempo, sem bengalas." },
{ id:"historia-jantar", track:"historia", kind:"fala", skill:"Humor e timing", title:"A história de jantar", level:2, seconds:60, focus:"pausas",
  brief:"Conta uma história engraçada que te aconteceu, com preparação, crescendo e frase final. Testa: a frase final tem de funcionar sozinha.",
  tip:"Corta tudo o que não leva à frase final. O humor vive da economia.",
  why:"Uma boa história de jantar é uma ferramenta social para a vida inteira." },
{ id:"esqueleto", track:"historia", kind:"escrita", skill:"Estrutura", title:"Esqueleto em cinco linhas", level:1, min:4, rubric:"historia",
  brief:"Escreve uma história tua em cinco linhas: gancho, contexto, conflito, ponto de viragem e fecho. Depois conta-a em voz alta.",
  placeholder:"Gancho:\nContexto:\nConflito:\nViragem:\nFecho:",
  tip:"Uma linha por elemento. Se uma linha não cabe numa frase, ainda não sabes o que ela é.",
  why:"Escrever o esqueleto separa a estrutura da execução. Primeiro o osso, depois a carne." },
{ id:"planta-colhe", track:"historia", kind:"escrita", skill:"Reviravolta", title:"Planta e colhe", level:3, min:5, rubric:"historia",
  brief:"Desenha uma história com reviravolta: escreve a pista que plantas no início, a revelação no fim e porque é que a revelação muda o início.",
  placeholder:"A pista (início):\nO desenvolvimento:\nA revelação (fim):\nO que muda no início:",
  tip:"A pista tem de parecer um detalhe sem importância à primeira vista.",
  why:"As reviravoltas boas não surpreendem por acaso. São construídas de trás para a frente." },
{ id:"quiz-historias", track:"historia", kind:"quiz", skill:"Anatomia", title:"Anatomia de uma história", level:1, min:2,
  brief:"Cinco perguntas sobre o que faz uma história prender do início ao fim.",
  questions:[
    { q:"Qual destas aberturas prende mais?", opts:["“Então, deixa-me contar uma coisa que me aconteceu.”","“Era uma vez um projeto em Genebra.”","“O camião ficou preso na neve a 300 metros da obra, com a bancada de 400 quilos lá dentro.”","“Isto é uma história muito engraçada.”"], a:2, why:"Começa no meio da ação, com um detalhe concreto e uma pergunta implícita: como é que isto se resolve?" },
    { q:"O que transforma um relato numa história?", opts:["Muitos detalhes","Uma mudança: algo está em jogo, há um obstáculo e alguém sai diferente","Um final engraçado","Ser verdadeira"], a:1, why:"Sem conflito e mudança há informação, não história." },
    { q:"Numa história com reviravolta, onde deve estar a pista?", opts:["Só no fim","No início, discreta, para que o final a ilumine","Não deve haver pista","Repetida várias vezes"], a:1, why:"A reviravolta satisfaz quando quem ouve pensa “estava ali o tempo todo”." },
    { q:"Qual é a forma mais forte de transmitir que estavas nervoso?", opts:["“Estava muito nervoso.”","“Estava nervosíssimo, mesmo muito.”","“Li o primeiro slide três vezes e continuava sem saber o que dizia.”","“Toda a gente fica nervosa nestas situações.”"], a:2, why:"Mostrar o comportamento faz quem ouve sentir. Nomear a emoção só informa." },
    { q:"Antes da frase final de uma anedota, o que aumenta o impacto?", opts:["Acelerar","Uma pausa curta e deliberada","Explicar a piada","Rir antes de dizer"], a:1, why:"A pausa cria expectativa e dá espaço para a frase final aterrar." }
  ],
  tip:"Responde por instinto e lê a explicação a seguir.", why:"Reconhecer os padrões nos outros é o primeiro passo para os usar nas tuas histórias." },

/* ---------------- SOCIAL & SEDUÇÃO ---------------- */
{ id:"abertura-situacional", track:"social", kind:"fala", skill:"Abertura", title:"Abertura situacional", level:1, seconds:20, focus:"finais",
  brief:"Bar de vinhos no Porto. Ela está a escolher uma garrafa na prateleira ao teu lado. Abre a conversa com uma observação sobre o momento, não com uma pergunta, em 15 segundos.",
  tip:"Uma observação com opinião (“Esse rótulo é escolha de quem sabe ou de quem gosta do desenho?”) dá-lhe algo a que responder sem a pôr em entrevista.",
  why:"As afirmações convidam. As perguntas em série interrogam." },
{ id:"modo-entrevista", track:"social", kind:"fala", skill:"Conversa", title:"Sair do modo entrevista", level:1, seconds:20, focus:"finais",
  brief:"Ela diz: “Sou arquiteta.” Responde com uma suposição curiosa em vez de uma pergunta. Estrutura possível: “Deixa-me adivinhar…”",
  tip:"Errar a suposição não faz mal. Dá-lhe o prazer de te corrigir e a conversa ganha vida.",
  why:"Uma suposição mostra personalidade e cria brincadeira. Perguntas seguidas criam um interrogatório." },
{ id:"puxar-fios", track:"social", kind:"fala", skill:"Threading", title:"Puxar fios", level:2, seconds:30, focus:"tom",
  brief:"Ela diz: “Voltei ontem de Lisboa, fui a um concerto e o comboio atrasou duas horas.” Há pelo menos três fios: Lisboa, o concerto, o atraso. Escolhe o mais emocional e continua a conversa a partir dele.",
  tip:"Escolhe o fio onde há emoção (o concerto), não o factual (o comboio).",
  why:"Quem puxa os fios certos nunca fica sem conversa e faz a outra pessoa sentir-se ouvida." },
{ id:"provocacao", track:"social", kind:"fala", skill:"Humor", title:"Provocação com carinho", level:2, seconds:20, focus:"tom",
  brief:"Ela diz que nunca come sobremesa. Responde com uma provocação leve e calorosa, que a faça rir sem a diminuir.",
  tip:"A boa provocação brinca com a situação ou com uma escolha, nunca com uma insegurança. Sorri enquanto dizes.",
  why:"A brincadeira cria cumplicidade e tensão boa. É o oposto de uma conversa de entrevista de emprego." },
{ id:"elogio", track:"social", kind:"fala", skill:"Elogio", title:"O elogio que fica", level:1, seconds:15, focus:"finais",
  brief:"Faz um elogio específico a uma escolha dela (o estilo, uma opinião, a forma como conta algo), numa frase, e segue a conversa sem esperar resposta.",
  tip:"Diz e avança. Esperar pela reação transforma o elogio num pedido.",
  why:"Um elogio a uma escolha mostra atenção. Um elogio genérico ao físico mostra só interesse." },
{ id:"paixao", track:"social", kind:"fala", skill:"Ligação", title:"Paixão contagiante", level:2, seconds:45, focus:"dinamica",
  brief:"Conta algo que te apaixona de forma a que ela sinta o que sentes. Não expliques o que é: leva-a para dentro do momento.",
  tip:"Fala do que sentes quando fazes a coisa, não da coisa em si.",
  why:"As pessoas não se ligam a factos, ligam-se a emoções partilhadas." },
{ id:"profundidade", track:"social", kind:"fala", skill:"Ligação", title:"Da superfície à profundidade", level:3, seconds:45, focus:"pausas",
  brief:"A conversa está em “então, e o trabalho?”. Leva-a em três passos: de factos para sentimentos, e de sentimentos para valores. Por exemplo: o que faz, o que lhe dá gozo nisso, o que isso diz sobre ela.",
  tip:"Depois de cada pergunta profunda, partilha também algo teu. Profundidade é uma troca.",
  why:"Conversas sobre valores criam ligação em minutos que conversas sobre factos não criam em horas." },
{ id:"voz-jantar", track:"social", kind:"fala", skill:"Voz e tensão", title:"Voz de reunião, voz de jantar", level:2, seconds:30, focus:"ritmo",
  brief:"Diz a mesma frase duas vezes: primeiro como numa reunião, depois como num jantar a dois, mais lento, mais baixo, com pausas. “Sabes que tens uma forma muito tua de ver as coisas.”",
  tip:"Na versão íntima, abranda 20%, baixa o volume e deixa o silêncio trabalhar.",
  why:"O mesmo conteúdo com outra voz cria outra atmosfera. A tensão boa vive no ritmo." },
{ id:"convite", track:"social", kind:"fala", skill:"Convite", title:"O convite claro", level:1, seconds:20, focus:"finais",
  brief:"Convida-a para um plano concreto (dia, sítio e porquê), de forma direta e leve. Sem “se calhar” e sem “quando quiseres”.",
  tip:"Um plano concreto é mais fácil de aceitar do que um “temos de combinar”.",
  why:"Clareza é atraente. Um convite vago passa a decisão e o risco todo para ela." },
{ id:"aposto-todas", track:"social", kind:"fala", skill:"Compostura", title:"“Aposto que dizes isso a todas”", level:2, seconds:20, focus:"hesitacoes",
  brief:"Ela diz, a sorrir: “Aposto que dizes isso a todas.” Responde com humor e sem te justificares.",
  tip:"Aceita a moldura e brinca com ela. Explicar-te é o que tira força.",
  why:"Um pequeno teste lúdico é um convite a mostrares à-vontade, não uma acusação." },
{ id:"nao-classe", track:"social", kind:"fala", skill:"Compostura", title:"Receber um não com classe", level:2, seconds:20, focus:"finais",
  brief:"Ela diz que não está interessada. Responde de forma a saíres com elegância e boa memória, sem insistir.",
  tip:"Agradece, deseja-lhe uma boa noite e sai de verdade. Sem segunda tentativa.",
  why:"A forma como aceitas um não diz mais sobre ti do que qualquer abordagem, e protege a tua reputação no círculo social." },
{ id:"historia-revela", track:"social", kind:"fala", skill:"Storytelling social", title:"Uma história que revela", level:2, seconds:60, focus:"tom",
  brief:"Conta uma história curta que revele uma qualidade tua (coragem, humor, cuidado) sem nunca a dizer.",
  tip:"Se tiveres de dizer a qualidade no fim, a história não a mostrou.",
  why:"Uma história mostra quem és sem parecer que te estás a vender." },
{ id:"escuta", track:"social", kind:"fala", skill:"Escuta ativa", title:"Escuta que se nota", level:1, seconds:30, focus:"pausas",
  brief:"Ela conta: “Este ano mudei de emprego. Deixei uma empresa grande para ir para um atelier pequeno. Ganho menos, mas sinto que voltei a desenhar.” Reflete o que ela sente e o que isso diz sobre ela, em 20 segundos, antes de falares de ti.",
  tip:"Reflete a emoção, não os factos. “Voltaste a fazer o que te dá vida” vale mais do que “mudaste de emprego”.",
  why:"Sentir-se compreendido é das sensações mais raras e mais atraentes que podes dar a alguém." },
{ id:"saida-gancho", track:"social", kind:"fala", skill:"Fecho", title:"Saída com gancho", level:2, seconds:20, focus:"finais",
  brief:"Tens de ir embora. Termina a conversa no ponto alto, com uma referência a algo que só vocês os dois perceberam, e deixa o próximo passo no ar.",
  tip:"Sair no ponto alto deixa vontade de mais. Esperar que a conversa morra deixa alívio.",
  why:"A última impressão é a que fica na memória quando ela pensar em ti." },
{ id:"entrar-grupo", track:"social", kind:"fala", skill:"Grupo", title:"Entrar num grupo", level:3, seconds:30, focus:"dinamica",
  brief:"Num jantar de amigos de amigos, há um grupo de quatro a conversar. Entra na conversa sem interromper, ganha a atenção do grupo e não só de uma pessoa.",
  tip:"Fala para o grupo todo e reparte o olhar. Ganhar o grupo abre a porta a cada pessoa.",
  why:"Em contexto social, quem está bem com o grupo transmite valor social a todos." },
{ id:"retomar", track:"social", kind:"escrita", skill:"Mensagens", title:"Retomar a conversa", level:2, min:3, rubric:"mensagem",
  brief:"Conheceste-a há cinco dias, trocaram números e a conversa morreu. Escreve a mensagem que a faz responder com vontade. Bónus: uma referência ao que falaram.",
  placeholder:"A tua mensagem…",
  tip:"Curta, específica e leve. Uma referência partilhada vale mais do que “então, tudo bem?”.",
  why:"A mensagem certa reabre a emoção da conversa, não só o contacto." },
{ id:"chat-encontro", track:"social", kind:"escrita", skill:"Mensagens", title:"Do chat ao encontro", level:2, min:3, rubric:"mensagem",
  brief:"A conversa por mensagem está boa há três dias. Escreve a mensagem que a passa para um encontro real, com plano concreto.",
  placeholder:"A tua mensagem…",
  tip:"Propõe dia, sítio e um motivo ligado à conversa. Deixa-lhe espaço para ajustar.",
  why:"Conversas por mensagem que não passam a encontro morrem. O convite no pico de energia é o que funciona." },
{ id:"quiz-sinais", track:"social", kind:"quiz", skill:"Calibração", title:"Ler sinais", level:2, min:3,
  brief:"Seis situações reais. Lê os sinais e escolhe o passo certo. É aqui que se separa insistência de calibração.",
  questions:[
    { q:"Estás a falar com ela há dez minutos. Responde com frases curtas, olha várias vezes para as amigas e não te faz nenhuma pergunta. O que fazes?", opts:["Fazes mais perguntas para a envolver","Contas uma história tua mais interessante","Fechas com elegância e voltas para o teu grupo","Pedes-lhe o número antes que seja tarde"], a:2, why:"Respostas curtas, atenção dispersa e zero perguntas são sinais claros de pouco interesse naquele momento. Sair cedo e com classe preserva a tua imagem e a hipótese de um segundo contacto." },
    { q:"Ela vira o corpo para ti, faz perguntas sobre a tua vida e ri-se mesmo quando a piada não é grande coisa. Qual é o passo certo?", opts:["Manter a conversa igual, para não arriscar","Aprofundar: partilhar algo mais pessoal ou propor um plano","Fingir desinteresse para a testar","Elogiá-la várias vezes seguidas"], a:1, why:"Ela está a investir. Corresponder com mais profundidade ou com um próximo passo concreto é o que mantém a tensão a subir. Fingir desinteresse confunde quem está a dar sinais claros." },
    { q:"Ela diz, a sorrir: “És sempre assim tão confiante?” Que tipo de resposta funciona melhor?", opts:["Explicar que és tímido, na verdade","Uma resposta leve que aceita a moldura sem a levar a sério","Mudar de assunto depressa","Perguntar, preocupado, porque é que ela diz isso"], a:1, why:"É um pequeno teste lúdico. Quem se justifica perde força; quem brinca com a pergunta mostra à-vontade. Por exemplo: “Só às terças. Hoje é que dia?”" },
    { q:"Por mensagem, ela demora horas a responder e responde só com “haha” ou “sim”. O que fazes?", opts:["Mandas várias mensagens para reacender","Mandas uma mensagem com um plano concreto; se não houver interesse, deixas estar","Respondes com a mesma demora, de propósito","Pedes-lhe explicações pela falta de interesse"], a:1, why:"Um convite claro resolve a dúvida depressa. Se não houver resposta com interesse, a melhor jogada é investir a tua energia noutro lado, sem drama." },
    { q:"Estás a contar uma história e reparas que ela olha para o telemóvel. Qual é o melhor ajuste?", opts:["Acelerar para chegar ao fim","Cortar a história no ponto alto e devolver-lhe o foco","Pedir-lhe que guarde o telemóvel","Contar com mais pormenor"], a:1, why:"Calibrar é ajustar em tempo real. Encurtar e devolver o foco a ela recupera a atenção sem constrangimento." },

/* ===================== MOTOR: voz, texto, pontuação, estatísticas ===================== */
const tick = () => new Promise(r=>setTimeout(r,0));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function pct(arr, p){ if(!arr.length) return NaN; const a=Float64Array.from(arr).sort(); const i=(a.length-1)*p; const lo=Math.floor(i), hi=Math.ceil(i); return a[lo]+(a[hi]-a[lo])*(i-lo); }
function median(a){ return pct(a,.5); }
function mean(a){ let s=0; for(const v of a) s+=v; return a.length? s/a.length : NaN; }
function std(a){ if(a.length<2) return 0; const m=mean(a); let s=0; for(const v of a) s+=(v-m)*(v-m); return Math.sqrt(s/(a.length-1)); }
const fin = v => v!=null && !isNaN(v) && isFinite(v);

/* ---------- Pitch (YIN) ---------- */
const _d = new Float32Array(1024), _cm = new Float32Array(1024);
function yin(x, s, W, MINL, MAXL, SR){
  const d=_d, cm=_cm;
  for(let tau=1; tau<=MAXL; tau++){ let sum=0; for(let j=0;j<W;j++){ const df=x[s+j]-x[s+j+tau]; sum+=df*df; } d[tau]=sum; }
  let run=0; cm[0]=1;
  for(let tau=1; tau<=MAXL; tau++){ run+=d[tau]; cm[tau]= run>0 ? d[tau]*tau/run : 1; }
  let best=-1, bestV=1;
  for(let tau=MINL; tau<=MAXL; tau++){
    if(cm[tau] < 0.15){ while(tau+1<=MAXL && cm[tau+1]<cm[tau]) tau++; best=tau; bestV=cm[tau]; break; }
    if(cm[tau] < bestV){ bestV=cm[tau]; best=tau; }
  }
  if(best<=0 || bestV>=0.35) return NaN;
  let t=best;
  if(best>MINL && best<MAXL){ const a=cm[best-1], b=cm[best], c=cm[best+1]; const den=a-2*b+c; if(den>0) t = best + 0.5*(a-c)/den; }
  return SR/t;
}

/* ---------- Ficheiros e reamostragem ---------- */
async function decodeFile(file){
  const buf = await file.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) throw new Error("no-audio");
  const ctx = new AC();
  try{
    return await new Promise((res,rej)=>{
      try{ const p = ctx.decodeAudioData(buf.slice(0), res, rej); if(p && p.then) p.then(res, rej); }catch(e){ rej(e); }
    });
  } finally { try{ ctx.close(); }catch(e){} }
}
function toMono8k(ab, maxSec){
  const sr = ab.sampleRate, ch = ab.numberOfChannels;
  const n = Math.min(ab.length, Math.floor(maxSec*sr));
  const mono = new Float32Array(n);
  for(let c=0;c<ch;c++){ const d=ab.getChannelData(c); for(let i=0;i<n;i++) mono[i]+=d[i]/ch; }
  let clip=0; for(let i=0;i<n;i++) if(Math.abs(mono[i])>0.985) clip++;
  const L = Math.max(1, Math.round(sr/8000)); const half=Math.floor(L/2);
  const P = new Float64Array(n+1); for(let i=0;i<n;i++) P[i+1]=P[i]+mono[i];
  const outN = Math.floor(n*8000/sr), out = new Float32Array(outN);
  const ma = j => { const a=Math.max(0,j-half), b=Math.min(n,j-half+L); return (P[b]-P[a])/Math.max(1,b-a); };
  for(let i=0;i<outN;i++){ const pos=i*sr/8000, k=Math.floor(pos), fr=pos-k; out[i]= ma(k)*(1-fr) + ma(Math.min(n-1,k+1))*fr; }
  return { x:out, clipRatio: clip/Math.max(1,n), truncated: ab.length>n };
}

/* ---------- Análise completa de uma gravação ---------- */
async function analyzeVoice(x, onProgress){
  const SR=8000, HOP=80, W=300, MINL=23, MAXL=107; // 75–350 Hz
  const FL = W+MAXL+1;
  const nF = Math.max(0, Math.floor((x.length-FL)/HOP));
  if(nF < 200) throw new Error("short");
  const db = new Float32Array(nF);
  for(let f=0; f<nF; f++){ const s=f*HOP; let e=0; for(let j=0;j<W;j++){ const v=x[s+j]; e+=v*v; } db[f]=10*Math.log10(e/W+1e-10); }
  const floor = pct(db,.10), peak = pct(db,.97);
  const thr = floor + Math.max(6, 0.30*(peak-floor));
  const snr = peak-floor;
  const sp = new Uint8Array(nF); for(let f=0;f<nF;f++) sp[f]= db[f]>thr ? 1:0;
  fillRuns(sp, 0, 15); fillRuns(sp, 1, 8, true);
  const f0 = new Float32Array(nF).fill(NaN);
  for(let f=0; f<nF; f++){
    if(db[f] > thr) f0[f] = yin(x, f*HOP, W, MINL, MAXL, SR);
    if(f % 1500 === 0){ onProgress && onProgress(0.1 + 0.75*f/nF); await tick(); }
  }
  removeShortVoiced(f0, 4);

  const cats=[["fillers","m-fill"],["hedges","m-hedge"],["apology","m-hedge"],["sensory","m-sense"],["turns","m-turn"],["dialogue","m-dial"],["emotions","m-emo"],["assume","m-play"]];
  const map=new Map(); cats.forEach(([k,cls])=>(L[k]||[]).forEach(term=>{ if(!map.has(term.toLowerCase())) map.set(term.toLowerCase(), cls); }));
  const terms=[...map.keys()].sort((a,b)=>b.length-a.length);
  if(!terms.length) return escHtml(text);
  const re=new RegExp("(^|[^\\p{L}&#;])("+terms.map(escRe).join("|")+")(?=$|[^\\p{L}])","giu");
  return escHtml(text).replace(re,(m,pre,w)=>{ const cls=map.get(w.toLowerCase().replace(/\s+/g," ")); return pre+(cls?`<mark class="${cls}">${w}</mark>`:w); });
}
