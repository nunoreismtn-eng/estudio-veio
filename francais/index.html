<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#EDEFEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1315" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calepin">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Calepin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Francês profissional para a pedra natural, ao estilo Pimsleur: ouvir, responder em voz alta, repetir.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Marcellus&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ===================== Calepin · Le français de la pierre ===================== */
:root{
  --bg:#EDEFEE; --surface:#FFFFFF; --surface-2:#F5F6F5; --sunk:#E4E8E7;
  --ink:#162023; --ink-2:#435055; --ink-3:#69767B; --ink-4:#97A1A5;
  --line:#D9DEDD; --line-2:#C3CAC9;
  --verd:#2B6B64; --verd-ink:#1E5550; --verd-soft:#DAEAE6; --verd-wash:#EDF5F3;
  --brass:#9A7428; --brass-ink:#6F521B; --brass-soft:#F2E8D2;
  --danger:#A0453A; --danger-soft:#F5E1DD;
  --on-accent:#FFFFFF;
  --hm0:#E2E6E5; --hm1:#C6E0DA; --hm2:#93C5BB; --hm3:#5AA295; --hm4:#2F7E72; --hm5:#1C5B52;
  --kn:#2B6B64; --lr:#A9D1C9; --track:#E3EBE9;
  --shadow:0 1px 0 rgba(22,32,35,.04), 0 14px 34px -22px rgba(22,32,35,.38);
  --shadow-lg:0 30px 60px -30px rgba(22,32,35,.45);
  --glass:rgba(255,255,255,.82);
  --r:16px; --r-sm:11px;
  --f-display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --f-fr:"EB Garamond", Garamond, "Times New Roman", serif;
  --f-ui:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --sb:env(safe-area-inset-bottom, 0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1315; --surface:#151C1F; --surface-2:#1A2326; --sunk:#11171A;
    --ink:#E5EBEA; --ink-2:#B3BEBE; --ink-3:#889496; --ink-4:#5F6B6D;
    --line:#253033; --line-2:#334043;
    --verd:#5CAB9F; --verd-ink:#8FD0C5; --verd-soft:#1B3431; --verd-wash:#142522;
    --brass:#CFA757; --brass-ink:#E6C887; --brass-soft:#2D2617;
    --danger:#E28C7D; --danger-soft:#3A201C;
    --on-accent:#0B1312;
    --hm0:#1E272A; --hm1:#1E3C37; --hm2:#245750; --hm3:#2F756A; --hm4:#46988B; --hm5:#77C2B5;
    --kn:#5CAB9F; --lr:#2A514B; --track:#1F2A2C;
    --shadow:0 1px 0 rgba(0,0,0,.25), 0 16px 36px -22px rgba(0,0,0,.7);
    --shadow-lg:0 30px 60px -30px rgba(0,0,0,.8);
    --glass:rgba(21,28,31,.82);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1315; --surface:#151C1F; --surface-2:#1A2326; --sunk:#11171A;
  --ink:#E5EBEA; --ink-2:#B3BEBE; --ink-3:#889496; --ink-4:#5F6B6D;
  --line:#253033; --line-2:#334043;
  --verd:#5CAB9F; --verd-ink:#8FD0C5; --verd-soft:#1B3431; --verd-wash:#142522;
  --brass:#CFA757; --brass-ink:#E6C887; --brass-soft:#2D2617;
  --danger:#E28C7D; --danger-soft:#3A201C;
  --on-accent:#0B1312;
  --hm0:#1E272A; --hm1:#1E3C37; --hm2:#245750; --hm3:#2F756A; --hm4:#46988B; --hm5:#77C2B5;
  --kn:#5CAB9F; --lr:#2A514B; --track:#1F2A2C;
  --shadow:0 1px 0 rgba(0,0,0,.25), 0 16px 36px -22px rgba(0,0,0,.7);
  --shadow-lg:0 30px 60px -30px rgba(0,0,0,.8);
  --glass:rgba(21,28,31,.82);
  color-scheme:dark;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--bg); }
body{ margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.5 var(--f-ui); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; overflow-x:hidden; }
body.locked{ overflow:hidden; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
a{ color:var(--verd-ink); }
[hidden]{ display:none !important; }
p{ margin:0; }
h1,h2,h3,h4{ margin:0; font-weight:600; }
:focus-visible{ outline:2px solid var(--verd); outline-offset:2px; }
[lang="fr"]{ hyphens:manual; }

.ic{ width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.ic.fill{ fill:currentColor; stroke:none; }

/* ---------- Layout ---------- */
.app{ min-height:100vh; min-height:100dvh; display:grid; grid-template-columns:1fr; }
.rail{ display:none; }
.main{ width:100%; max-width:760px; margin:0 auto; padding:0 var(--gr) calc(96px + var(--sb)) var(--gl); }
.view{ padding-top:max(14px, env(safe-area-inset-top, 0px)); }
@media (min-width:900px){
  .app{ grid-template-columns:252px minmax(0,1fr); }
  .rail{ display:flex; flex-direction:column; gap:28px; position:sticky; top:0; height:100vh; height:100dvh; padding:26px 18px 22px; border-right:1px solid var(--line); background:var(--surface-2); }
  .tabbar{ display:none !important; }
  .main{ padding:8px 40px 64px; }
  .only-m{ display:none !important; }
}
.brand, .m-brand{ display:flex; align-items:center; gap:11px; }
.brand-mark{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--ink); color:var(--surface); flex:none; }
.brand-mark .mark{ width:28px; height:28px; }
.brand-txt{ display:flex; flex-direction:column; line-height:1.1; }
.brand-txt b{ font:400 21px/1.05 var(--f-display); letter-spacing:.01em; }
.brand-txt small{ font:italic 400 14px/1.2 var(--f-fr); color:var(--ink-3); }
.m-brand .brand-mark{ width:34px; height:34px; border-radius:10px; }
.m-brand .brand-mark .mark{ width:24px; height:24px; }
.m-brand .brand-txt b{ font-size:19px; }
.rail-tabs{ display:flex; flex-direction:column; gap:4px; }
.rtab{ position:relative; display:flex; align-items:center; gap:12px; height:44px; padding:0 12px; border:0; border-radius:11px; background:none; color:var(--ink-2); font-weight:600; font-size:14.5px; text-align:left; }
.rtab:hover{ background:var(--sunk); color:var(--ink); }
.rtab.on{ background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line); }
.rtab.on .ic{ color:var(--verd); }
.rtab .badge{ margin-left:auto; }
.rail-foot{ margin-top:auto; display:flex; flex-direction:column; align-items:flex-start; gap:10px; }

.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(4,1fr); padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + var(--sb)) max(8px, env(safe-area-inset-left,0px)); background:var(--glass); -webkit-backdrop-filter:saturate(1.4) blur(18px); backdrop-filter:saturate(1.4) blur(18px); border-top:1px solid var(--line); }
body.typing .tabbar{ display:none; }
.tab{ position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 5px; border:0; background:none; color:var(--ink-3); font-size:11.5px; font-weight:600; letter-spacing:.01em; }
.tab .ic{ width:23px; height:23px; }
.tab.on{ color:var(--ink); }
.tab.on .ic{ color:var(--verd); }
.tab.on::before{ content:""; position:absolute; top:-7px; left:calc(50% - 14px); width:28px; height:2px; border-radius:2px; background:var(--verd); }
.badge{ position:absolute; top:2px; left:calc(50% + 6px); min-width:17px; height:17px; padding:0 5px; border-radius:9px; background:var(--brass); color:#fff; font:700 10.5px/17px var(--f-ui); font-style:normal; text-align:center; }
:root[data-theme="dark"] .badge{ color:#1A1406; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .badge{ color:#1A1406; } }
.rtab .badge{ position:static; }

/* ---------- Type ---------- */
.display{ font:400 34px/1.06 var(--f-display); letter-spacing:-.005em; }
.eyebrow{ font:600 11px/1.3 var(--f-ui); letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); }
.fr-title{ font:italic 400 31px/1.08 var(--f-fr); letter-spacing:-.005em; margin:6px 0 2px; }
.pt-sub{ color:var(--ink-3); font-weight:500; }
.muted{ color:var(--ink-3); }
.sm{ font-size:13px; }
.hint{ color:var(--ink-3); font-size:13.5px; line-height:1.5; margin-top:8px; }
.hint.warn{ color:var(--danger); }
.sec-title{ font:400 21px/1.15 var(--f-display); }
.sec-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
.q-fr{ font-family:var(--f-fr); font-style:italic; font-size:1.1em; letter-spacing:0; color:var(--verd-ink); }

/* ---------- Header ---------- */
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:8px 0 4px; }
.page-head .eyebrow{ margin-bottom:6px; }
.hoje-head{ align-items:center; padding-top:4px; }
@media (min-width:900px){ .hoje-head{ display:none; } .page-head{ padding-top:26px; } }
.hello{ margin:22px 0 4px; }
.hello .display{ font-size:clamp(34px, 9vw, 44px); }
.fr-date{ font:italic 400 19px/1.3 var(--f-fr); color:var(--ink-3); margin-top:6px; }
.icon-btn{ width:42px; height:42px; display:grid; place-items:center; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); flex:none; }
.icon-btn:hover{ color:var(--ink); border-color:var(--line-2); }
.icon-btn.ghostly{ visibility:hidden; }

/* ---------- Buttons ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 18px; border-radius:12px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); font:600 14.5px/1.1 var(--f-ui); text-decoration:none; white-space:nowrap; transition:background .15s, border-color .15s, transform .1s; }
.btn:active{ transform:scale(.985); }
.btn .ic{ width:18px; height:18px; }
.btn.primary{ background:var(--verd); border-color:transparent; color:var(--on-accent); box-shadow:0 10px 22px -14px var(--verd); }
.btn.primary:hover{ filter:brightness(1.06); }
.btn.ghost{ background:transparent; }
.btn.ghost:hover{ background:var(--surface-2); }
.btn.lg{ min-height:52px; padding:0 22px; font-size:15.5px; border-radius:14px; }
.btn.sm{ min-height:36px; padding:0 13px; font-size:13.5px; border-radius:10px; }
.btn.block{ width:100%; }
.btn.danger{ color:var(--danger); }
.btn.danger.armed{ background:var(--danger-soft); border-color:var(--danger); }
.btn:disabled{ opacity:.5; cursor:default; }
.linkbtn{ display:inline-flex; align-items:center; gap:4px; padding:0; border:0; background:none; color:var(--verd-ink); font-weight:600; font-size:13.5px; text-decoration:none; }
.linkbtn .ic{ width:15px; height:15px; }
.row-btns{ display:flex; flex-wrap:wrap; gap:8px; }

.pbtns{ display:flex; gap:6px; flex:none; }
.pbtn{ position:relative; width:38px; height:38px; display:grid; place-items:center; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); flex:none; transition:background .15s, color .15s, border-color .15s; }
.pbtn .ic{ width:18px; height:18px; }
.pbtn.txt{ font:italic 500 14px/1 var(--f-fr); letter-spacing:.01em; }
.pbtn:hover{ border-color:var(--line-2); color:var(--ink); }
.pbtn.playing{ background:var(--verd-soft); border-color:transparent; color:var(--verd-ink); }
.pbtn.playing::after{ content:""; position:absolute; inset:-4px; border-radius:50%; border:1.5px solid var(--verd); opacity:.5; animation:ring 1.3s ease-out infinite; }
.pbtn.rec{ background:var(--brass-soft); border-color:var(--brass); color:var(--brass-ink); }
.pbtn.rec::after{ content:""; position:absolute; inset:-4px; border-radius:50%; border:1.5px solid var(--brass); animation:ring 1.1s ease-out infinite; }
@keyframes ring{ from{ transform:scale(.9); opacity:.7; } to{ transform:scale(1.35); opacity:0; } }

/* ---------- Cards ---------- */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; margin-top:14px; }
.notice{ display:flex; gap:12px; align-items:flex-start; margin-top:14px; padding:14px 16px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface); }
.notice > .ic{ margin-top:1px; color:var(--verd); }
.notice.n-warn{ background:var(--brass-soft); border-color:color-mix(in oklab, var(--brass) 35%, transparent); }
.notice.n-warn > .ic{ color:var(--brass-ink); }
.notice > div > b{ display:block; font-size:14.5px; }
.notice p{ color:var(--ink-2); font-size:13.5px; margin-top:3px; }
.notice-a{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

/* dimension line: the cote of a technical drawing */
.cote{ display:flex; align-items:center; gap:10px; margin:16px 0 14px; color:var(--ink-3); font:500 11.5px/1 var(--f-mono); letter-spacing:.02em; }
.cote i{ position:relative; flex:1; height:1px; background:currentColor; opacity:.75; }
.cote i::before, .cote i::after{ content:""; position:absolute; top:-5px; width:1px; height:11px; background:currentColor; }
.cote i:first-child::before{ left:0; }
.cote i:first-child::after{ left:0; transform:rotate(45deg); height:9px; top:-4px; }
.cote i:last-child::after{ right:0; }
.cote i:last-child::before{ right:0; transform:rotate(45deg); height:9px; top:-4px; }

/* ---------- Hoje ---------- */
.hero{ margin-top:18px; background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:var(--shadow); }
.hero-stone{ position:relative; height:clamp(118px, 30vw, 168px); overflow:hidden; border-bottom:1px solid var(--line); }
.stone{ display:block; width:100%; height:100%; }
:root[data-theme="dark"] .stone{ filter:brightness(.86) saturate(.95); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .stone{ filter:brightness(.86) saturate(.95); } }
.hero-stone .stone{ position:absolute; inset:0; }
.hero-num{ position:absolute; right:14px; bottom:-16px; font:400 clamp(96px, 27vw, 136px)/1 var(--f-fr); font-variant-numeric:lining-nums; color:rgba(22,32,35,.6); letter-spacing:-.03em; }
.hero-mod{ position:absolute; left:14px; top:14px; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.82); color:#1B2427; font:600 11px/1 var(--f-ui); letter-spacing:.1em; text-transform:uppercase; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.hero-mod span{ text-transform:none; letter-spacing:0; font:italic 500 13px/1 var(--f-fr); }
.hero-body{ padding:18px 18px 20px; }
.hero-sit{ margin-top:12px; color:var(--ink-2); line-height:1.55; }
.facts{ list-style:none; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; margin:0; padding:0; }
.facts li{ display:flex; flex-direction:column; }
.facts b{ font:600 22px/1.1 var(--f-ui); letter-spacing:-.01em; }
.facts span{ font-size:12.5px; line-height:1.3; color:var(--ink-3); margin-top:3px; }
.facts.center{ width:100%; text-align:center; margin:18px 0 6px; }
.facts.center li{ align-items:center; }
.resume{ height:4px; border-radius:4px; background:var(--track); margin-top:16px; overflow:hidden; }
.resume span{ display:block; height:100%; background:var(--brass); border-radius:0 4px 4px 0; }
.hero-actions{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
.hero-actions .btn.primary{ flex:1 1 auto; }
.hero-actions .btn.ghost{ flex:0 0 auto; }
.duo{ display:grid; grid-template-columns:1fr; gap:0; }
@media (min-width:640px){ .duo{ grid-template-columns:1fr 1fr; gap:14px; } }
.rv h3, .pod h3{ font:600 18px/1.25 var(--f-ui); margin:6px 0 6px; letter-spacing:-.01em; }
.rv .muted{ font-size:13.5px; }
.rv .btn{ margin-top:14px; }
.rv.hot{ border-color:color-mix(in oklab, var(--verd) 40%, var(--line)); background:linear-gradient(180deg, var(--verd-wash), var(--surface) 70%); }
.pod-fr{ font:italic 400 24px/1.2 var(--f-fr); margin:10px 0 6px; color:var(--ink); }
.pod-pt{ color:var(--ink-3); font-size:14px; }
.pod .pbtns{ margin-top:14px; }
.course{ margin-top:30px; }
.cm{ display:grid; gap:8px; }
.cm-row{ display:grid; grid-template-columns:40px 1fr auto; align-items:center; gap:12px; width:100%; padding:10px 12px 10px 10px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); text-align:left; }
.cm-row:hover{ border-color:var(--line-2); }
.sw{ display:block; width:40px; height:40px; border-radius:9px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.sw.sm{ width:28px; height:28px; border-radius:7px; }
.cm-t{ display:flex; flex-direction:column; min-width:0; }
.cm-t b{ font:italic 400 19px/1.15 var(--f-fr); }
.cm-t small{ color:var(--ink-3); font-size:12.5px; }
.cm-steps{ display:flex; gap:4px; }
.cm-steps i{ width:16px; height:5px; border-radius:3px; background:var(--track); }
.cm-steps i.on{ background:var(--verd); }

/* ---------- Lições ---------- */
.mod{ margin-top:26px; }
.mod-banner{ position:relative; height:132px; border-radius:var(--r); overflow:hidden; border:1px solid var(--line); }
.mod-banner .stone{ position:absolute; inset:0; }
.mod-banner::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(255,255,255,.72), rgba(255,255,255,.18) 70%, transparent); }
.mod-banner.dark::after{ background:linear-gradient(90deg, rgba(10,14,16,.62), rgba(10,14,16,.12) 75%, transparent); }
.mb-txt{ position:absolute; z-index:1; left:16px; right:16px; bottom:14px; display:flex; flex-direction:column; color:#172023; }
.mod-banner.dark .mb-txt, .ls-head.dark .ls-ht{ color:#F1F3F2; }
.mb-num{ font:500 11.5px/1.2 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; opacity:.85; }
.mb-fr{ font:400 30px/1.1 var(--f-display); margin-top:4px; }
.mb-pt{ font-size:13px; font-weight:500; opacity:.82; margin-top:3px; }
.lrows{ margin-top:4px; }
.lrow{ display:grid; grid-template-columns:34px minmax(0,1fr) auto 16px; align-items:center; gap:12px; width:100%; padding:14px 2px; border:0; border-bottom:1px solid var(--line); background:none; text-align:left; }
.lrow:last-child{ border-bottom:0; }
.lrow:hover .ltxt b{ color:var(--verd-ink); }
.lnum{ font:500 13px/1 var(--f-mono); color:var(--ink-3); }
.ltxt{ display:flex; flex-direction:column; min-width:0; }
.ltxt b{ font:italic 400 21px/1.15 var(--f-fr); transition:color .15s; }
.ltxt small{ color:var(--ink-3); font-size:13px; margin-top:2px; }
.chev{ width:16px; height:16px; color:var(--ink-4); }
.lstat{ display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:999px; font:600 11.5px/1.2 var(--f-ui); white-space:nowrap; }
.lstat .ic{ width:13px; height:13px; stroke-width:2.2; }
.lstat.done{ color:var(--verd-ink); background:var(--verd-soft); }
.lstat.next{ color:var(--brass-ink); background:var(--brass-soft); }
.lstat.redo{ color:var(--danger); background:var(--danger-soft); }

/* lesson sheet */
.ls-head{ position:relative; height:116px; border-radius:var(--r-sm); overflow:hidden; border:1px solid var(--line); }
.ls-head .stone{ position:absolute; inset:0; }
.ls-head::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(255,255,255,.78), rgba(255,255,255,.2) 75%, transparent); }
.ls-head.dark::after{ background:linear-gradient(90deg, rgba(10,14,16,.66), rgba(10,14,16,.12) 75%, transparent); }
.ls-ht{ position:absolute; z-index:1; left:14px; right:14px; bottom:12px; display:flex; flex-direction:column; color:#172023; }
.ls-ht .fr-title{ margin:4px 0 0; font-size:28px; }
.ls-sit{ margin-top:14px; color:var(--ink-2); line-height:1.55; }
.ls-actions{ display:flex; gap:10px; flex-wrap:wrap; }
.ls-actions .btn{ flex:1 1 160px; }
.ls-h{ font:400 19px/1.2 var(--f-display); margin:26px 0 8px; display:flex; align-items:baseline; gap:8px; }
.ls-h small{ font:500 12px var(--f-mono); color:var(--ink-3); }
.ls-note{ padding:12px 14px; border-left:2px solid var(--brass); background:var(--surface-2); border-radius:0 10px 10px 0; color:var(--ink-2); margin-top:8px; line-height:1.55; }
.ls-dlg .dl{ display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:start; padding:10px 0; border-bottom:1px solid var(--line); }
.ls-dlg .dl:last-child{ border-bottom:0; }

/* speakers */
.who{ display:inline-flex; align-items:center; justify-content:center; min-width:42px; height:22px; padding:0 7px; margin-top:2px; border-radius:6px; font:italic 500 13.5px/1 var(--f-fr); letter-spacing:.01em; }
.w-A{ background:var(--verd-soft); color:var(--verd-ink); }
.w-N{ background:var(--ink); color:var(--surface); }
.w-C{ background:var(--brass-soft); color:var(--brass-ink); }
.dl-t .fr{ font:italic 400 19px/1.3 var(--f-fr); }
.dl-t .pt{ font-size:13.5px; color:var(--ink-3); margin-top:2px; }

/* ---------- Frases ---------- */
.tools{ display:flex; flex-direction:column; gap:10px; margin:16px 0 8px; }
.seg{ display:flex; padding:3px; border-radius:12px; background:var(--sunk); gap:2px; }
.seg button{ flex:1; min-height:38px; padding:0 10px; border:0; border-radius:9px; background:none; color:var(--ink-2); font-weight:600; font-size:13.5px; }
.seg button.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.seg.sm button{ min-height:34px; font-size:13px; }
.search{ display:flex; align-items:center; gap:10px; height:46px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink-3); }
.search:focus-within{ border-color:var(--verd); box-shadow:0 0 0 3px var(--verd-soft); }
.search input{ flex:1; min-width:0; height:100%; border:0; outline:0; background:none; color:var(--ink); font-size:15px; }
.grp{ border-bottom:1px solid var(--line); }
.grp summary{ display:grid; grid-template-columns:auto minmax(0,1fr) 16px; align-items:center; gap:12px; padding:15px 2px; cursor:pointer; list-style:none; }
.grp summary::-webkit-details-marker{ display:none; }
.grp summary .chev{ transition:transform .2s; }
.grp[open] summary .chev{ transform:rotate(90deg); }
.grp:not(:has(.lnum)) summary{ grid-template-columns:minmax(0,1fr) 16px; }
.flist{ padding:0 0 10px; }
.frow{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 12px; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
.flist .frow:first-child{ border-top:0; }
.ftx .fr{ font:italic 400 20px/1.25 var(--f-fr); }
.ftx .pt{ font-size:13.5px; color:var(--ink-3); margin-top:2px; }
.fres{ grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; font-size:13.5px; }
.sc{ font-weight:700; padding:2px 8px; border-radius:6px; }
.sc.ok{ background:var(--verd-soft); color:var(--verd-ink); }
.sc.mid{ background:var(--brass-soft); color:var(--brass-ink); }
.sc.low{ background:var(--danger-soft); color:var(--danger); }
.miss, .heard{ color:var(--ink-2); }
.heard i, .miss i{ font-family:var(--f-fr); font-size:1.08em; }
.listening{ color:var(--brass-ink); font-weight:600; }
.listening.big{ display:inline-flex; align-items:center; gap:8px; font-size:15px; }
.box{ display:inline-flex; gap:3px; margin-top:7px; vertical-align:middle; }
.box i{ width:12px; height:4px; border-radius:2px; background:var(--track); }
.box i.on{ background:var(--verd); }
.glist{ padding:0 0 10px; }
.grow{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line); }
.glist .grow:first-child{ border-top:0; }
.g-fr{ font:italic 400 19px/1.2 var(--f-fr); }
.g-gen{ font:500 11px var(--f-mono); color:var(--ink-3); font-style:normal; }
.g-pt{ color:var(--ink-2); font-size:14px; }
.empty{ text-align:center; padding:36px 12px; color:var(--ink-3); }
.empty .btn{ margin-top:14px; }
.empty.big{ padding:24px 8px 40px; }
.empty.big h3{ font:400 24px/1.2 var(--f-display); color:var(--ink); margin-top:20px; }
.empty.big p{ max-width:380px; margin:8px auto 0; }
.empty-stone{ width:220px; height:88px; margin:20px auto 0; border-radius:14px; overflow:hidden; border:1px solid var(--line); }

/* ---------- Progresso ---------- */
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
@media (min-width:640px){ .tiles{ grid-template-columns:repeat(4,1fr); } }
.tile{ display:flex; flex-direction:column; padding:14px 14px 13px; border-radius:var(--r-sm); background:var(--surface); border:1px solid var(--line); }
.t-l{ font-size:12.5px; color:var(--ink-3); font-weight:500; }
.t-v{ font:600 28px/1.15 var(--f-ui); letter-spacing:-.02em; margin-top:6px; }
.t-s{ font-size:12px; color:var(--ink-3); margin-top:2px; }
.chart-card{ padding-bottom:14px; }
.hm-wrap{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px; }
.hm-days{ display:grid; grid-template-rows:repeat(7, 1fr); gap:3px; padding-top:18px; font:500 10.5px/1 var(--f-mono); color:var(--ink-3); }
.hm-days span{ display:flex; align-items:center; }
.hm-months{ display:grid; grid-template-columns:repeat(12, 1fr); gap:3px; height:14px; margin-bottom:4px; font:500 10.5px/1 var(--f-mono); color:var(--ink-3); }
.hm{ display:grid; grid-template-columns:repeat(12, 1fr); grid-template-rows:repeat(7, auto); grid-auto-flow:column; gap:3px; }
.c{ display:block; aspect-ratio:1; border-radius:3px; background:var(--hm0); max-height:30px; }
.c.l1{ background:var(--hm1); } .c.l2{ background:var(--hm2); } .c.l3{ background:var(--hm3); } .c.l4{ background:var(--hm4); } .c.l5{ background:var(--hm5); }
.c.fut{ background:transparent; box-shadow:inset 0 0 0 1px var(--line); opacity:.5; }
.c.today{ box-shadow:0 0 0 1.5px var(--surface), 0 0 0 3px var(--ink-3); }
.c[data-tip]:hover, .c[data-tip]:focus-visible{ outline:2px solid var(--ink); outline-offset:1px; }
.hm-foot{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-top:12px; flex-wrap:wrap; }
.hm-scale{ display:inline-flex; align-items:center; gap:3px; font-size:12px; color:var(--ink-3); }
.hm-scale i{ width:12px; height:12px; aspect-ratio:auto; }
.hm-scale i:first-of-type{ margin-left:5px; } .hm-scale i:last-of-type{ margin-right:5px; }
.tview summary{ font-size:12.5px; font-weight:600; color:var(--verd-ink); cursor:pointer; }
.tview table{ margin-top:8px; border-collapse:collapse; font-size:13px; }
.tview th, .tview td{ text-align:left; padding:4px 14px 4px 0; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
.tview th{ color:var(--ink-3); font-weight:600; }
.legend{ display:flex; flex-wrap:wrap; gap:6px 16px; margin:-4px 0 12px; font-size:12.5px; color:var(--ink-3); }
.legend span{ display:inline-flex; align-items:center; gap:6px; }
.legend i{ width:12px; height:8px; border-radius:2px; }
.k-kn{ background:var(--kn); } .k-lr{ background:var(--lr); }
.mrow{ display:grid; grid-template-columns:minmax(120px, 34%) minmax(0,1fr) auto; gap:12px; align-items:center; padding:9px 0; border-radius:8px; }
.mrow:focus-visible{ outline-offset:4px; }
.mr-name{ display:flex; align-items:center; gap:10px; min-width:0; }
.mr-name b{ display:block; font:italic 400 17px/1.15 var(--f-fr); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mr-name small{ font-size:12px; color:var(--ink-3); }
.mr-bar{ position:relative; height:12px; border-radius:0 4px 4px 0; background:var(--track); overflow:hidden; }
.mr-bar i{ position:absolute; left:0; top:0; bottom:0; border-radius:0 4px 4px 0; }
.mr-bar .lr{ background:var(--lr); }
.mr-bar .kn{ background:var(--kn); box-shadow:2px 0 0 var(--surface); }
.mr-val{ font:600 15px/1 var(--f-ui); font-variant-numeric:tabular-nums; min-width:52px; text-align:right; }
.mr-val small{ font-weight:500; color:var(--ink-3); font-size:12px; }
.hist{ list-style:none; margin:0; padding:0; }
.hist li{ display:grid; grid-template-columns:64px minmax(0,1fr) auto; gap:12px; padding:11px 0; border-top:1px solid var(--line); align-items:baseline; font-size:14px; }
.hist li:first-child{ border-top:0; }
.h-d{ font:500 12px var(--f-mono); color:var(--ink-3); }
.h-t span[lang="fr"]{ font-family:var(--f-fr); font-style:italic; font-size:1.1em; }
.h-m{ font:500 12.5px var(--f-mono); color:var(--ink-3); }
.ftip{ position:fixed; z-index:90; transform:translate(-50%, -100%); padding:7px 10px; border-radius:8px; background:var(--ink); color:var(--surface); font:600 12.5px/1.3 var(--f-ui); pointer-events:none; white-space:nowrap; box-shadow:var(--shadow-lg); }

/* ---------- Overlay: player, review, welcome ---------- */
.ov{ position:fixed; inset:0; z-index:40; background:var(--surface); overflow-y:auto; overscroll-behavior:contain; }
.ov > *{ animation:rise .3s cubic-bezier(.2,.8,.2,1); }
@keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
.pl{ min-height:100%; display:flex; flex-direction:column; max-width:640px; margin:0 auto; padding:max(10px, env(safe-area-inset-top,0px)) var(--gr) 0 var(--gl); }
.pl-top{ display:grid; grid-template-columns:42px 1fr 42px; align-items:center; gap:10px; padding:4px 0 10px; }
.pl-title{ display:flex; flex-direction:column; align-items:center; text-align:center; min-width:0; }
.pl-title span{ font:500 11px/1.2 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); }
.pl-title b{ font:italic 400 19px/1.2 var(--f-fr); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.pl-pop{ margin:0 0 12px; padding:14px; border-radius:var(--r-sm); background:var(--surface-2); border:1px solid var(--line); display:grid; gap:8px; }
.pl-prog{ display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; }
.pl-track{ height:3px; border-radius:3px; background:var(--track); overflow:hidden; }
.pl-track i{ display:block; height:100%; width:0; background:var(--verd); border-radius:3px; transition:width .5s ease; }
#pl-left{ font:500 11.5px/1 var(--f-mono); color:var(--ink-3); min-width:42px; text-align:right; }
.pl-phases{ list-style:none; display:flex; gap:4px; margin:12px 0 0; padding:0; overflow-x:auto; scrollbar-width:none; }
.pl-phases::-webkit-scrollbar{ display:none; }
.pl-phases li{ flex:1 0 auto; text-align:center; padding:6px 8px; border-radius:8px; font:italic 400 14px/1 var(--f-fr); color:var(--ink-4); white-space:nowrap; transition:color .2s, background .2s; }
.pl-phases li.past{ color:var(--ink-3); }
.pl-phases li.on{ color:var(--ink); background:var(--sunk); }
.pl-stage{ flex:1; display:flex; flex-direction:column; align-items:center; padding:clamp(10px, 3vh, 28px) 0 8px; }
.dial{ position:relative; width:min(48vw, 196px); aspect-ratio:1; flex:none; }
.d-stone{ position:absolute; inset:9%; border-radius:50%; overflow:hidden; opacity:.75; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.d-stone::after{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 46%, color-mix(in oklab, var(--surface) 62%, transparent) 30%, color-mix(in oklab, var(--surface) 8%, transparent) 78%); }
.dial > svg{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
.d-track{ fill:none; stroke:var(--line); stroke-width:2; }
.d-arc{ fill:none; stroke:var(--verd); stroke-width:3.5; stroke-linecap:round; stroke-dasharray:100; stroke-dashoffset:100; opacity:0; }
.d-arc.count{ opacity:1; animation:drain var(--d, 3s) linear forwards; }
@keyframes drain{ from{ stroke-dashoffset:0; } to{ stroke-dashoffset:100; } }
.dial[data-state="answer"] .d-arc{ stroke:var(--brass); }
.d-pulse{ position:absolute; inset:9%; border-radius:50%; }
.d-pulse::before, .d-pulse::after{ content:""; position:absolute; inset:0; border-radius:50%; border:1.5px solid var(--verd); opacity:0; }
.dial[data-state="listen"] .d-pulse::before, .dial[data-state="listen"] .d-pulse::after,
.dial[data-state="prof"] .d-pulse::before, .dial[data-state="prof"] .d-pulse::after,
.dial[data-state="mic"] .d-pulse::before, .dial[data-state="mic"] .d-pulse::after{ animation:wave 1.8s ease-out infinite; }
.dial[data-state="listen"] .d-pulse::after, .dial[data-state="prof"] .d-pulse::after, .dial[data-state="mic"] .d-pulse::after{ animation-delay:.9s; }
.dial[data-state="prof"] .d-pulse::before, .dial[data-state="prof"] .d-pulse::after{ border-color:var(--ink-4); }
.dial[data-state="mic"] .d-pulse::before, .dial[data-state="mic"] .d-pulse::after{ border-color:var(--brass); }
@keyframes wave{ from{ transform:scale(1); opacity:.55; } to{ transform:scale(1.32); opacity:0; } }
.d-label{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 18%; }
.d-label b{ font:400 clamp(22px, 6vw, 27px)/1.05 var(--f-display); color:var(--ink); }
.d-label small{ margin-top:7px; font:600 10.5px/1.2 var(--f-ui); letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); }
.dial[data-state="answer"] .d-label b{ color:var(--brass-ink); }
.dial[data-state="repeat"] .d-label b, .dial[data-state="listen"] .d-label b{ color:var(--verd-ink); }
.pl-cue{ min-height:22px; margin:12px 0 2px; font:600 13px/1.3 var(--f-ui); letter-spacing:.02em; color:var(--ink-3); text-align:center; }
.pl-card{ width:100%; max-width:560px; min-height:10.5em; text-align:center; padding:6px 2px 0; }
.pc-label{ font:600 11px/1.3 var(--f-ui); letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); margin-bottom:10px; }
.pc-label span[lang="fr"]{ text-transform:none; letter-spacing:0; font:italic 500 14px var(--f-fr); }
.pc-pt{ font:500 clamp(18px, 4.8vw, 21px)/1.35 var(--f-ui); color:var(--ink); text-wrap:balance; letter-spacing:-.005em; }
.pc-fr{ margin-top:16px; font:italic 400 clamp(26px, 7.2vw, 34px)/1.18 var(--f-fr); color:var(--verd-ink); text-wrap:balance; min-height:1.2em; opacity:.45; transition:opacity .35s, transform .35s; transform:translateY(4px); }
.pc-fr.on{ opacity:1; transform:none; }
.dots{ color:var(--ink-4); letter-spacing:.3em; font-style:normal; font-family:var(--f-ui); font-size:22px; }
.audio-only{ display:inline-flex; align-items:center; gap:6px; font:600 13px var(--f-ui); color:var(--ink-3); font-style:normal; }
.audio-only .ic{ width:16px; height:16px; }
.pc-title{ font:italic 400 clamp(32px, 9vw, 42px)/1.06 var(--f-fr); }
.pc-sub{ color:var(--ink-3); font-weight:500; margin-top:6px; }
.pc-say{ font:400 clamp(16px, 4.4vw, 18.5px)/1.55 var(--f-ui); color:var(--ink-2); text-wrap:pretty; }
.pc-say.note{ color:var(--ink); }
.pc-src{ margin-top:18px; font-size:12.5px; color:var(--ink-4); }
.pc-src span{ font-family:var(--f-fr); font-style:italic; font-size:1.08em; }
.pc-dlg{ max-height:min(38vh, 320px); overflow-y:auto; text-align:left; display:flex; flex-direction:column; gap:12px; padding:4px 2px; scroll-behavior:smooth; }
.pc-dlg .dl{ display:grid; grid-template-columns:auto 1fr; gap:10px; opacity:.42; transition:opacity .3s; }
.pc-dlg .dl.on{ opacity:1; }
.pc-dlg .dl .fr{ font-size:21px; }
.pc-cue{ display:flex; gap:10px; align-items:flex-start; justify-content:center; text-align:left; padding:12px 14px; margin-bottom:16px; border-radius:var(--r-sm); background:var(--surface-2); border:1px solid var(--line); }
.pc-cue p{ font:italic 400 20px/1.3 var(--f-fr); }
.pl-warn{ margin-top:12px; padding:8px 12px; border-radius:10px; background:var(--brass-soft); color:var(--brass-ink); font-size:13px; font-weight:600; text-align:center; }
.pl-ctl{ position:sticky; bottom:0; padding:12px 0 calc(16px + var(--sb)); background:linear-gradient(180deg, transparent, var(--surface) 18%); display:grid; gap:14px; }
.pl-main{ display:flex; align-items:center; justify-content:center; gap:clamp(22px, 8vw, 40px); }
.cbtn{ position:relative; width:54px; height:54px; display:grid; place-items:center; border-radius:50%; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); }
.cbtn .ic{ width:22px; height:22px; }
.cbtn small{ position:absolute; top:calc(100% + 5px); left:50%; transform:translateX(-50%); font-size:11px; font-weight:600; color:var(--ink-3); white-space:nowrap; }
.cbtn.big{ width:78px; height:78px; border:0; background:var(--verd); color:var(--on-accent); box-shadow:0 14px 28px -14px var(--verd); }
.cbtn.big .ic{ width:28px; height:28px; }
.pl-sub{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
.chip-btn{ display:inline-flex; align-items:center; gap:7px; min-height:42px; padding:0 16px; border-radius:999px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); font:600 13.5px/1 var(--f-ui); }
.chip-btn .ic{ width:17px; height:17px; }
.chip-btn:disabled{ opacity:.45; cursor:default; }
.chip-btn.hot{ border-color:var(--brass); background:var(--brass-soft); color:var(--brass-ink); }
.pl-done{ display:flex; flex-direction:column; align-items:center; text-align:center; max-width:460px; padding-top:8px; }
.medal{ position:relative; width:112px; height:112px; border-radius:50%; overflow:hidden; box-shadow:0 0 0 1px var(--line), var(--shadow); margin-bottom:18px; }
.medal .stone{ position:absolute; inset:0; }
.medal span{ position:absolute; inset:0; display:grid; place-items:center; }
.medal span .ic{ width:44px; height:44px; padding:9px; border-radius:50%; background:var(--verd); color:var(--on-accent); stroke-width:2.4; }
.pl-done .fr-title{ font-size:34px; }
.done-q{ width:100%; margin-top:16px; padding:16px; border-radius:var(--r-sm); background:var(--surface-2); border:1px solid var(--line); }
.done-q > p{ font-weight:600; margin-bottom:10px; }
.done-msg{ margin-top:10px; font-size:14px; color:var(--ink-2); }
.done-msg:empty{ display:none; }
.done-actions{ display:flex; gap:10px; justify-content:center; }
.done-actions .btn{ flex:1; max-width:240px; }
.grades{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.gbtn{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:12px 6px; border-radius:14px; border:1px solid var(--line-2); background:var(--surface); }
.gbtn b{ font-size:15px; }
.gbtn small{ font-size:11.5px; color:var(--ink-3); }
.gbtn.g2{ border-color:color-mix(in oklab, var(--verd) 55%, var(--line)); }
.gbtn.g2 b{ color:var(--verd-ink); }
.gbtn.g0 b{ color:var(--danger); }
.gbtn.sug{ box-shadow:0 0 0 2px var(--brass); }
.rv-res{ justify-content:center; margin-top:14px; }

/* welcome */
.wel{ max-width:560px; margin:0 auto; padding-bottom:calc(28px + var(--sb)); }
.wel-stone{ position:relative; height:clamp(170px, 34vh, 250px); overflow:hidden; }
.wel-stone .stone{ position:absolute; inset:0; }
.wel-stone::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, var(--surface)); }
.wel-mark{ position:absolute; z-index:1; left:50%; bottom:6px; transform:translateX(-50%); width:72px; height:72px; border-radius:20px; display:grid; place-items:center; background:var(--ink); color:var(--surface); box-shadow:var(--shadow-lg); }
.wel-mark .mark{ width:48px; height:48px; }
.wel-body{ padding:16px var(--gr) 0 var(--gl); text-align:center; }
.wel-title{ font:400 46px/1 var(--f-display); margin-top:6px; }
.wel-sub{ font:italic 400 22px/1.2 var(--f-fr); color:var(--ink-3); margin-top:4px; }
.wel-lead{ margin:18px auto 0; max-width:440px; color:var(--ink-2); line-height:1.55; }
.wel-pts{ list-style:none; margin:22px 0 0; padding:0; text-align:left; display:grid; gap:14px; }
.wel-pts li{ display:grid; grid-template-columns:44px 1fr; gap:12px; align-items:start; }
.wel-pts .num{ width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--verd-soft); color:var(--verd-ink); font:400 19px var(--f-display); }
.wel-pts .num .ic{ width:20px; height:20px; }
.wel-pts b{ font-size:15px; }
.wel-pts p{ font-size:13.5px; color:var(--ink-3); margin-top:2px; line-height:1.45; }
.wel-form{ display:grid; gap:10px; margin-top:24px; text-align:left; }
.wel-sound{ display:flex; flex-direction:column; align-items:center; gap:2px; margin:16px 0 14px; }

/* ---------- Forms & settings ---------- */
.field{ display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:var(--ink-2); }
.field input, .field select{ height:46px; padding:0 13px; border-radius:11px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); font-size:15px; font-weight:400; width:100%; min-width:0; }
.field select{ -webkit-appearance:none; appearance:none; padding-right:34px; background-image:linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position:calc(100% - 18px) 20px, calc(100% - 13px) 20px; background-size:5px 5px, 5px 5px; background-repeat:no-repeat; text-overflow:ellipsis; }
.field input:focus, .field select:focus{ outline:0; border-color:var(--verd); box-shadow:0 0 0 3px var(--verd-soft); }
.set-sec{ padding:18px 0; border-top:1px solid var(--line); display:grid; gap:10px; }
.set-sec:first-child{ border-top:0; padding-top:4px; }
.set-sec h3{ font:400 19px/1.2 var(--f-display); }
.set-l{ font-size:13px; font-weight:600; color:var(--ink-2); margin-top:4px; }
.vrow{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:end; }
.vrow .btn{ height:46px; width:46px; padding:0; }
.tog{ display:flex; align-items:flex-start; gap:12px; font-size:14.5px; font-weight:500; cursor:pointer; padding:4px 0; }
.tog input{ appearance:none; -webkit-appearance:none; flex:none; width:42px; height:25px; border-radius:13px; background:var(--line-2); position:relative; transition:background .2s; margin:0; cursor:pointer; }
.tog input::after{ content:""; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .2s; }
.tog input:checked{ background:var(--verd); }
.tog input:checked::after{ transform:translateX(17px); }
.tog span{ display:flex; flex-direction:column; padding-top:2px; }
.tog small{ font-size:12.5px; color:var(--ink-3); font-weight:400; margin-top:2px; }
.about p{ color:var(--ink-2); font-size:14px; line-height:1.6; }

/* ---------- Sheet ---------- */
.sheet-wrap{ position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center; }
.sheet-backdrop{ position:absolute; inset:0; background:rgba(10,15,17,.42); animation:fade .2s ease; }
@keyframes fade{ from{ opacity:0; } }
.sheet{ position:relative; width:100%; max-width:640px; max-height:92vh; max-height:92dvh; display:flex; flex-direction:column; background:var(--surface); border-radius:22px 22px 0 0; box-shadow:var(--shadow-lg); animation:up .3s cubic-bezier(.2,.8,.2,1); }
@keyframes up{ from{ transform:translateY(30px); opacity:0; } }
.sheet-head{ position:relative; display:flex; align-items:center; gap:10px; padding:16px var(--gr) 10px var(--gl); border-bottom:1px solid var(--line); }
.grab{ position:absolute; top:6px; left:calc(50% - 18px); width:36px; height:4px; border-radius:2px; background:var(--line-2); }
.sheet-title{ flex:1; font:400 21px/1.2 var(--f-display); }
.sheet-body{ overflow-y:auto; padding:16px var(--gr) calc(24px + var(--sb)) var(--gl); overscroll-behavior:contain; }
@media (min-width:700px){ .sheet-wrap{ align-items:center; } .sheet{ border-radius:22px; max-height:86vh; } .sheet-head{ padding-left:22px; padding-right:22px; } .sheet-body{ padding:18px 22px 26px; } }

.toast{ position:fixed; left:50%; bottom:calc(86px + var(--sb)); z-index:95; transform:translateX(-50%); max-width:calc(100% - 32px); padding:11px 16px; border-radius:12px; background:var(--ink); color:var(--surface); font-weight:600; font-size:14px; box-shadow:var(--shadow-lg); animation:up .25s ease; }
@media (min-width:900px){ .toast{ bottom:28px; } }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  .d-arc.count{ animation:drain var(--d, 3s) linear forwards !important; }
}

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const fin = v => v!=null && !isNaN(v) && isFinite(v);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const escHtml = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hashStr(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function seeded(seed){ let s=seed||1; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }

/* ---------- Days (local calendar) ---------- */
const DAY = 86400000;
function dayKey(ts){ const d=new Date(ts==null?Date.now():ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function keyDate(k){ const p=String(k).split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(k, n){ const d=keyDate(k); d.setDate(d.getDate()+n); return dayKey(d.getTime()); }
function daysBetween(a, b){ return Math.round((keyDate(b)-keyDate(a))/DAY); }

/* ---------- Text ---------- */
// «…» is French everywhere in the course; Portuguese quotes use “…”.
const FALLBACK = { name:"Pedro", company:"Pedra Nobre" };
const Persona = { name:"", company:"" };
function fill(t){ return String(t==null?"":t).replace(/\{nome\}/g, Persona.name||FALLBACK.name).replace(/\{empresa\}/g, Persona.company||FALLBACK.company); }
// French display typography: typographic apostrophe, narrow no-break space before ? ! : ; » and after «
function frTypo(t){ return fill(t).replace(/'/g,"’").replace(/\s+([?!:;»])/g," $1").replace(/«\s*/g,"« "); }
const frHtml = t => escHtml(frTypo(t));
function segs(t){
  const out=[], re=/«\s*([^»]*?)\s*»/g; let last=0, m;
  while((m=re.exec(t))){ if(m.index>last) out.push({ fr:false, text:t.slice(last,m.index) }); out.push({ fr:true, text:m[1] }); last=re.lastIndex; }
  if(last<t.length) out.push({ fr:false, text:t.slice(last) });
  return out;
}
// Portuguese with the French quotations set in the French face
function ptHtml(t){ return segs(fill(t)).map(s=> s.fr ? `<span class="q-fr">«${escHtml(frTypo(s.text).replace(/^ | $/g,""))}»</span>` : escHtml(s.text.replace(/'/g,"’"))).join(""); }
const frSpeech = t => fill(t).replace(/[«»“”"]/g,"").replace(/…/g,".").replace(/\s+/g," ").trim();
const ptSpeech = t => fill(t).replace(/[«»“”"]/g,"").replace(/…/g,".").replace(/\s+/g," ").trim();
// narrator line → parts to voice: Portuguese, with the «French» bits in a French voice
function speechParts(t){
  const out=[];
  segs(fill(t)).forEach(s=>{ const lang=s.fr?"fr":"pt"; chunkText(s.fr?frSpeech(s.text):ptSpeech(s.text)).forEach(text=>out.push({ lang, text })); });
  return out.filter(p=>/[\p{L}\p{N}]/u.test(p.text));
}
// long lines go out sentence by sentence: some browser voices stop after about 15 seconds
function chunkText(t, max){
  max=max||150; if(t.length<=max) return [t];
  const out=[]; let cur="";
  t.split(/(?<=[.!?;:])\s+/).forEach(p=>{ if(cur && (cur+" "+p).length>max){ out.push(cur); cur=p; } else cur = cur ? cur+" "+p : p; });
  if(cur) out.push(cur);
  return out;
}
function speechSec(text, lang, rate){ const n=(text||"").length; return 0.35 + n*(/^fr/i.test(lang||"")?0.068:0.062)/(rate||1); }
function readSec(text){ return Math.max(1.6, 0.9 + String(text||"").length*0.05); }

/* ---------- Pronunciation check (speech recognition → words) ---------- */
const NUM_U = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const NUM_T = ["","","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
function nombre(n){
  n=Math.floor(Math.abs(n));
  if(n<20) return NUM_U[n];
  if(n<100){
    const t=Math.floor(n/10), u=n%10;

/* ---------- Lesson script (Pimsleur-style) ----------

   Every step carries u (unit: the block that Voltar/Saltar move by) and ph (phase).                                   */
const PHASES = [
  { id:"dialogue", fr:"Dialogue", pt:"Diálogo" },
  { id:"vocab", fr:"Vocabulaire", pt:"Vocabulário" },
  { id:"practice", fr:"Pratique", pt:"Prática" },
  { id:"role", fr:"Conversation", pt:"Conversa" },
  { id:"end", fr:"Fin", pt:"Fim" }
];
const COACH = "Como funciona: eu digo-te o que queres dizer, em português. Tu respondes em francês, em voz alta, antes de ouvires a resposta certa. Depois repetes. Falar em voz alta é o que fixa a língua.";
const LEADS = {
  neu: ["Repara como se diz:", "Ouve como se diz:", "E agora:"],
  recall: [["Como se diz","?"], ["Lembras-te? Como se diz","?"], ["Diz em francês:",""], ["Agora em francês:",""]],
  drill: ["Como dirias:", "Tenta dizer:", "Diz em francês:"],

// “phrase” for the narrator: Portuguese quotes are display-only, French stays in «»

function buildLesson(L, ctx){

  const pick=a=>a[Math.floor(rnd()*a.length)];

  const dialogue=()=>L.dialogue.forEach((d,j)=>{ unit(); fr(d[0], d[1], { card:{ kind:"line", who:d[0], fr:d[1], pt:d[2], j } }); add({ t:"gap", sec:0.45 }); });

  L.roles.forEach(r=>{
    unit();

/* ---------- Spaced review (Leitner boxes) ---------- */
const BOX_DAYS = [0, 1, 3, 7, 16, 35];

function srsGrade(srs, id, g, today, practice){

  if(g===2){ if(!practice){ it.b=Math.min(5, it.b+1); it.due=addDays(today, BOX_DAYS[it.b]); } }
  else if(g===1){ if(!practice) it.due=addDays(today, 1); }

let _sid=0;
function stoneSVG(key, w, h, seed){
  const st=STONES[key]||STONES.carrara, r=seeded(hashStr(key+"#"+(seed||0))), id="sv"+(++_sid), f=v=>v.toFixed(1);
  const marble = key==="carrara" || key==="quartzite", q = key==="quartzite";

    defs+=`<filter id="${id}c" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="4" seed="${Math.floor(r()*90)}"/><feColorMatrix values="0 0 0 0 ${color[0]} 0 0 0 0 ${color[1]} 0 0 0 0 ${color[2]} 1.6 0 0 0 -0.7"/></filter>`;
    body+=`<rect width="${w}" height="${h}" filter="url(#${id}c)" opacity="${op}"/>`;
  };
  if(key==="granit"){

    const tile=(sz, n, pid)=>{ let t=""; for(let i=0;i<n;i++) t+=`<circle cx="${f(r()*sz)}" cy="${f(r()*sz)}" r="${f(0.35+r()*r()*1.5)}" fill="${cols[Math.floor(r()*cols.length)]}" opacity="${f(0.45+r()*0.5)}"/>`; defs+=`<pattern id="${id}${pid}" width="${sz}" height="${sz}" patternUnits="userSpaceOnUse">${t}</pattern>`; body+=`<rect width="${w}" height="${h}" fill="url(#${id}${pid})"/>`; };
    tile(61, 46, "a"); tile(47, 30, "b");
    cloud("0.02 0.03", [0.85,0.87,0.88], 0.22);
  } else if(key==="travertin"){
    cloud("0.004 0.05", [0.62,0.5,0.32], 0.35);
    for(let i=0;i<11;i++){ const y=h*(i+r())/11, dy=()=>f(y+(r()-0.5)*7); body+=`<path d="M-10 ${f(y)} C${f(w*0.3)} ${dy()} ${f(w*0.7)} ${dy()} ${w+10} ${dy()}" fill="none" stroke="${r()<0.5?"#F0E6D2":"#B39A6E"}" stroke-width="${f(0.8+r()*5)}" opacity="${f(0.15+r()*0.3)}"/>`; }
    for(let i=0;i<Math.round(w*h/1300);i++) body+=`<ellipse cx="${f(r()*w)}" cy="${f(r()*h)}" rx="${f(0.7+r()*2.6)}" ry="${f(0.3+r()*0.8)}" fill="#8A7049" opacity="${f(0.25+r()*0.3)}"/>`;
  } else {
    // veins: gentle curves across the slab, torn into natural shapes by a displacement map
    const S=Math.max(w,h), ang=(q?-28:-14)+(r()-0.5)*(q?16:20), sn=Math.floor(r()*500);
    cloud(q?"0.004 0.02":"0.008 0.012", q?[0.42,0.5,0.46]:[0.52,0.55,0.57], q?0.55:0.45);
    let lines="", halo="";
    for(let i=0;i<(q?7:6);i++){
      const y=h/2+(r()-0.5)*h*1.6, d=`M${f(w/2-S)} ${f(y)} C${f(w/2-S/3)} ${f(y+(r()-0.5)*h*0.6)} ${f(w/2+S/3)} ${f(y+(r()-0.5)*h*0.6)} ${f(w/2+S)} ${f(y+(r()-0.5)*h*0.4)}`;
      const major=i<2, wd=major ? (q?3.5:1.6)+r()*(q?3:1.2) : (q?0.8:0.45)+r()*(q?1.2:0.6);
      lines+=`<path d="${d}" stroke="${q&&major?"#F5F8F6":st.vein}" stroke-width="${f(wd)}" opacity="${f(major?0.75:0.35+r()*0.3)}"/>`;
      if(major) halo+=`<path d="${d}" stroke="${q?"#F4F7F5":st.vein}" stroke-width="${f(wd*7)}" opacity="${q?0.35:0.12}"/>`;
    }
    const disp=sd=>`<feTurbulence type="fractalNoise" baseFrequency="${q?"0.006 0.014":"0.008 0.007"}" numOctaves="3" seed="${sn}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="${q?60:50}" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="${sd}"/>`;
    defs+=`<filter id="${id}d" x="-30%" y="-30%" width="160%" height="160%">${disp(0.45)}</filter><filter id="${id}h" x="-30%" y="-30%" width="160%" height="160%">${disp(6)}</filter>`;
    body+=`<g transform="rotate(${f(ang)} ${w/2} ${h/2})" fill="none" stroke-linecap="round"><g filter="url(#${id}h)">${halo}</g><g filter="url(#${id}d)">${lines}</g></g>`;
  }
  return `<svg class="stone s-${key}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><defs>${defs}</defs>${body}</svg>`;

const SOFT_ERR = new Set(["interrupted","canceled","not-allowed"]);
const NARR = { failed:false };

async function sayFr(text, who, slow, alive){
  const v=Voice.pick[who]||Voice.pick.N||null;

  let r=await Voice.speak(frSpeech(text), o);
  if(alive() && !r.ok && v && !SOFT_ERR.has(r.err)) r=await Voice.speak(frSpeech(text), Object.assign({}, o, { voice:null }));   // the system's default French

}
async function sayPt(text, alive){
  const v=Voice.pick.P;
  let r=await Voice.speak(text, { voice:v, lang:"pt-PT", rate:1, pitch:1 });
  if(!alive() || r.ok || SOFT_ERR.has(r.err)) return r;
  if(v){ r=await Voice.speak(text, { voice:null, lang:"pt-PT", rate:1, pitch:1 }); if(!alive() || r.ok || SOFT_ERR.has(r.err)) return r; }
  NARR.failed=true; toast("A voz portuguesa não respondeu. O professor passa a aparecer em texto.");

}
// a narrator line: Portuguese, with the «French» quotations in the French voice
async function sayLine(text, alive){
  for(const p of speechParts(text)){
    if(!alive()) return { ok:false, err:"interrupted" };
    const r = p.lang==="fr" ? await sayFr(p.text, "N", false, alive) : await sayPt(p.text, alive);
    if(!alive()) return r;
    if(r.err==="not-allowed") return r;
    if(p.lang==="pt" && NARR.failed) return { ok:false, err:"narrator" };
  }
  return { ok:true };
}

  if(p[0]==="g"){ const g=GLOSSARY[+p[1]], t=g && g.items[+p[2]]; return t ? { text:t[0], who:"A" } : null; }
  if(p[0]==="d"){ const L=LESSON_BY_ID[p[1]], d=L && L.dialogue[+p[2]]; return d ? { text:d[1], who:d[0] } : null; }

const Tap = {
  btn:null, gen:0,
  async play(ref, slow, btn){
    const t=refText(ref); if(!t) return;
    if(P.playing) P.pause();
    const g=++this.gen; Voice.stop(); this.mark(btn); await sleep(50);
    if(g!==this.gen) return;
    const r=await sayFr(t.text, t.who, slow, ()=>g===this.gen);
    if(g!==this.gen) return;
    this.mark(null);
    if(!r.ok && !SOFT_ERR.has(r.err)) toast(soundTrouble());
  },
  mark(btn){ if(this.btn) this.btn.classList.remove("playing"); this.btn=btn||null; if(btn) btn.classList.add("playing"); },

function voiceNotice(where){
  const out=[];
  if(IN_VIEWER && APP_URL) out.push(["info", "No telemóvel, usa a app instalável", `Abre o link no Chrome do Android e escolhe <b>Instalar app</b>: fica com ícone, ecrã inteiro e as vozes do telemóvel.`, `<a class="btn sm ghost" href="${h(APP_URL)}" target="_blank" rel="noopener">Abrir a app ↗</a>`]);
  if(!Voice.ok) out.push(["warn", "Este browser não fala", "A app precisa de voz sintetizada. No Android, abre-a no Chrome.", ""]);
  else if(Voice.loaded && Voice.frStatus==="missing") out.push(["warn", "Falta a voz francesa", androidVoiceSteps("Francês (França)"), ""]);
  else if(Voice.loaded && Voice.all.length && !Voice.pick.P && S.settings.voices.P!=="off" && where!=="hoje-min") out.push(["info", "O professor aparece em texto", `Não encontrei uma voz portuguesa neste aparelho. ${androidVoiceSteps("Português (Portugal)")}`, ""]);
  return out.map(([k,t,p,a])=>`<section class="notice n-${k}">${ic(k==="warn"?"warn":"info")}<div><b>${h(t)}</b><p>${p}</p>${a?`<div class="notice-a">${a}</div>`:""}</div></section>`).join("");
}
function androidVoiceSteps(lang){
  return IS_ANDROID || !IS_MOBILE
    ? `No Android: Definições → procura “texto para voz” → Serviços de voz da Google → Instalar dados de voz → <b>${h(lang)}</b>.`
    : `Instala a voz <b>${h(lang)}</b> nas definições de acessibilidade do sistema.`;
}

function reviewCard(){
  const t=today(), due=srsDue(S.prog.srs, t).length, nx=srsNext(S.prog.srs, t), any=Object.keys(S.prog.srs).length;
  if(!any) return `<section class="card rv"><p class="eyebrow" lang="fr">Révision</p><h3>A revisão começa amanhã</h3><p class="muted">Depois de cada lição, as frases voltam aqui no dia certo: um dia depois, três, uma semana, duas, um mês.</p></section>`;
  if(due) return `<section class="card rv hot"><p class="eyebrow" lang="fr">Révision du jour</p><h3>${due} ${due===1?"frase":"frases"} para rever</h3><p class="muted">Cerca de ${Math.max(1,Math.round(due*14/60))} min. Ouves o português, respondes em voz alta e dizes se sabias.</p><button class="btn primary" data-act="review">${ic("repeat")} Rever agora</button></section>`;
  return `<section class="card rv"><p class="eyebrow" lang="fr">Révision</p><h3>Nada para rever hoje</h3><p class="muted">${nx?`Próxima revisão ${h(relDay(nx.day))}: ${nx.n} ${nx.n===1?"frase":"frases"}.`:""} Se te apetecer, treina dez frases ao acaso.</p><button class="btn ghost" data-act="practice">${ic("repeat")} Treino livre</button></section>`;

function phraseOfDay(){
  const learned=Object.keys(S.prog.srs).filter(id=>ITEM_BY_ID[id]);
  const pool=(learned.length ? learned.map(id=>ITEM_BY_ID[id]) : lessonItems(nextLesson()||LESSONS[0])).filter(it=>it.fr.split(" ").length>=3);
  const it=pool[hashStr(today())%pool.length];
  if(!it) return "";
  const ref="i:"+it.id;
  return `<section class="card pod" data-row><p class="eyebrow" lang="fr">Phrase du jour</p><p class="pod-fr" lang="fr">${frHtml(it.fr)}</p><p class="pod-pt">${ptHtml(it.pt)}</p>
    <div class="pbtns">${playBtns(ref)}</div><div class="fres" hidden></div></section>`;
}
function playBtns(ref){
  return `<button class="pbtn" data-act="say" data-ref="${ref}" aria-label="Ouvir">${ic("volume")}</button><button class="pbtn txt" data-act="say-slow" data-ref="${ref}" aria-label="Ouvir devagar" lang="fr">lent</button>${MIC_OK?`<button class="pbtn" data-act="check" data-ref="${ref}" aria-label="Verificar a pronúncia">${ic("mic")}</button>`:""}`;
}
function courseMini(){

let installEvt=null;
const STANDALONE = (()=>{ try{ return matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }catch(e){ return false; } })();
// Install help on the phone: the browser's own prompt when it offers one, otherwise the steps for this browser
const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const IN_APP_BROWSER = /; wv\)|FBAN|FBAV|Instagram|Line\/|LinkedInApp|Snapchat|TikTok/i.test(navigator.userAgent);

  if(IN_VIEWER || STANDALONE || !IS_MOBILE || Date.now() < Number(LS.get("install-later",0)||0)) return "";
  const later=`<button class="btn sm ghost" data-act="install-later">Agora não</button>`;
  if(installEvt) return `<section class="notice n-info">${ic("download")}<div><b>Instala a app no telemóvel</b><p>Fica com ícone no ecrã principal, abre em ecrã inteiro e funciona sem rede.</p><div class="notice-a"><button class="btn sm primary" data-act="install">Instalar</button>${later}</div></div></section>`;

    : IS_IOS ? `No Safari, toca em <b>Partilhar</b> e depois em <b>Adicionar ao ecrã principal</b>.`
    : /SamsungBrowser/i.test(ua) ? `Toca no menu <b>≡</b> e escolhe <b>Adicionar página a</b> → <b>Ecrã principal</b>.`

  return `<section class="notice n-info">${ic("download")}<div><b>Instala a app no telemóvel</b><p>${steps}</p><div class="notice-a">${later}</div></div></section>`;
}

/* ---------- Lições ---------- */
function lessonStatus(L, nx){
  const rec=S.prog.lessons[L.id], res=S.prog.resume && S.prog.resume.id===L.id;
  if(rec && rec.ok===false) return ["Repetir","redo"];
  if(res) return ["Em curso","next"];
  if(rec) return [`Feita${rec.n>1?` ${rec.n}×`:""}`,"done"];
  if(nx && nx.id===L.id) return ["Seguinte","next"];
  return ["",""];
}
function viewLicoes(){
  const nx=nextLesson();
  return `<header class="page-head"><div><p class="eyebrow">16 lições · 4 módulos · 15 min cada</p><h1 class="display" lang="fr">Leçons</h1></div>${setBtn()}</header>
  ${MODULES.map(M=>{
    const ls=LESSONS.filter(L=>L.m===M.id);
    return `<section class="mod"><div class="mod-banner ${M.stone==="granit"?"dark":""}">${stoneSVG(M.stone, 760, 150, M.n*7)}<div class="mb-txt"><span class="mb-num">Module ${M.n}</span><span class="mb-fr" lang="fr">${h(M.fr)}</span><span class="mb-pt">${h(M.pt)} · ${h(M.blurb)}</span></div></div>

}
function phraseRow(it){

/* ---------- Frases ---------- */
function viewFrases(){
  return `<header class="page-head"><div><p class="eyebrow">${N_ITEMS} frases · ${N_TERMS} termos técnicos</p><h1 class="display" lang="fr">Phrases</h1></div>${setBtn()}</header>
  <div class="tools">
    <div class="seg" role="tablist" aria-label="Ver">${[["frases","Frases das lições"],["glossario","Glossário técnico"]].map(([k,l])=>`<button role="tab" aria-selected="${S.seg===k}" class="${S.seg===k?"on":""}" data-act="seg" data-v="${k}">${l}</button>`).join("")}</div>
    <label class="search">${ic("search")}<input id="q" type="search" enterkeyhint="search" placeholder="${S.seg==="frases"?"Procurar em francês ou português":"Procurar termo: chant, tranche, devis…"}" value="${h(S.q)}" autocomplete="off" spellcheck="false" aria-label="Procurar"></label>
  </div>
  <div id="flist-host"></div>`;
}
function renderList(){
  const host=$("#flist-host"); if(!host) return;
  const q=fold(S.q).trim(), match=(...t)=>!q || t.some(x=>fold(x).includes(q));
  let html="";
  if(S.seg==="frases"){
    LESSONS.forEach(L=>{
      const its=lessonItems(L).filter(it=>match(fill(it.fr), fill(it.pt)));
      if(!its.length) return;
      const open = q ? true : S.open[L.id]!=null ? S.open[L.id] : L.n===1;
      const learned=its.filter(it=>S.prog.srs[it.id]).length;
      html+=`<details class="grp" data-g="${L.id}"${open?" open":""}><summary><span class="lnum">${pad2(L.n)}</span><span class="ltxt"><b lang="fr">${frHtml(L.fr)}</b><small>${h(L.pt)} · ${its.length} ${its.length===1?"frase":"frases"}${learned?` · ${learned} aprendidas`:""}</small></span>${ic("chevR","chev")}</summary><div class="flist">${its.map(phraseRow).join("")}</div></details>`;
    });
  } else {
    GLOSSARY.forEach((g,c)=>{
      const its=g.items.map((t,k)=>[t,k]).filter(([t])=>match(t[0], t[1]));
      if(!its.length) return;
      const key="g"+c, open = q ? true : S.open[key]!=null ? S.open[key] : c===0;
      html+=`<details class="grp" data-g="${key}"${open?" open":""}><summary><span class="ltxt"><b lang="fr">${h(g.cat)}</b><small>${h(g.pt)} · ${its.length}</small></span>${ic("chevR","chev")}</summary><div class="glist">${its.map(([t,k])=>`<div class="grow" data-row><span class="g-fr" lang="fr">${frHtml(t[0])}${t[2]?` <em class="g-gen">${t[2]==="f"?"fém.":"masc."}</em>`:""}</span><span class="g-pt">${h(t[1])}</span><button class="pbtn" data-act="say" data-ref="g:${c}:${k}" aria-label="Ouvir">${ic("volume")}</button></div>`).join("")}</div></details>`;
    });
  }
  host.innerHTML = html || `<div class="empty"><p>Nada encontrado para “${h(S.q)}”.</p><button class="btn ghost sm" data-act="clear-q">Limpar a pesquisa</button></div>`;
}

/* ---------- Progresso ---------- */
const HM_BINS=[0,5,10,20,30];   // minutes per day
function hmLevel(min){ if(!min) return 0; let l=1; HM_BINS.forEach((b,i)=>{ if(i>0 && min>b) l=i+1; }); return Math.min(5,l); }
function viewProgresso(){
  const st=stats(), p=S.prog;
  const head=`<header class="page-head"><div><p class="eyebrow">O teu ritmo</p><h1 class="display" lang="fr">Progrès</h1></div>${setBtn()}</header>`;
  if(!st.secs && !st.done) return head+`<div class="empty big"><div class="empty-stone">${stoneSVG("travertin", 300, 120, 5)}</div><h3>Ainda não há progresso</h3><p>Depois da primeira lição, vês aqui o tempo de prática, as frases que já tens na memória e os dias seguidos.</p><button class="btn primary" data-act="play-next">${ic("play","fill")} Começar a lição 1</button></div>`;
  const tiles=[
    ["Lições concluídas", `${st.done}`, `de ${LESSONS.length}`],
    ["Frases na memória", `${st.known}`, `${st.learned} aprendidas`],
    ["Tempo de prática", fmtDur(st.secs), "a falar e a ouvir"],
    ["Dias seguidos", `${st.streak}`, st.streak ? (p.days[today()] ? "contando hoje" : "treina hoje para manter") : "começa hoje"]
  ];
  return head+`
  <section class="tiles">${tiles.map(([l,v,s])=>`<div class="tile"><span class="t-l">${h(l)}</span><span class="t-v">${h(v)}</span><span class="t-s">${h(s)}</span></div>`).join("")}</section>
  ${heatmap()}
  ${mastery()}
  ${historyList()}`;
}
function heatmap(){
  const t=today(), now=keyDate(t), wd=(now.getDay()+6)%7, start=addDays(t, -(wd+7*11));
  let cells="", months="", lastM=-1, rows=[];
  for(let w=0; w<12; w++){
    const k0=addDays(start, w*7), m=keyDate(k0).getMonth();
    months+=`<span>${m!==lastM?PT_MONTHS[m]:""}</span>`; lastM=m;
    for(let d=0; d<7; d++){
      const k=addDays(start, w*7+d), fut=k>t, sec=S.prog.days[k]||0, min=Math.round(sec/60), lv=fut?-1:hmLevel(sec?Math.max(1,min):0);
      const tip=`${["seg","ter","qua","qui","sex","sáb","dom"][d]} ${ptShort(k)} · ${sec?fmtDur(sec):"sem prática"}`;
      cells+= fut ? `<span class="c fut"></span>` : `<span class="c l${lv}${k===t?" today":""}" data-tip="${h(tip)}"${sec?' tabindex="0"':""} role="img" aria-label="${h(tip)}"></span>`;
      if(sec) rows.push([k, sec]);
    }
  }
  return `<section class="card chart-card"><div class="sec-head"><h2 class="sec-title">Dias de prática</h2><span class="muted sm">últimas 12 semanas</span></div>
    <div class="hm-wrap"><div class="hm-days" aria-hidden="true"><span>seg</span><span></span><span>qua</span><span></span><span>sex</span><span></span><span></span></div><div class="hm-main"><div class="hm-months" aria-hidden="true">${months}</div><div class="hm">${cells}</div></div></div>
    <div class="hm-foot"><span class="hm-scale" aria-label="Escala: menos para mais minutos">menos ${[1,2,3,4,5].map(l=>`<i class="c l${l}"></i>`).join("")} mais</span>
    <details class="tview"><summary>Ver em tabela</summary>${rows.length?`<table><thead><tr><th>Dia</th><th>Prática</th></tr></thead><tbody>${rows.reverse().map(([k,s])=>`<tr><td>${h(ptShort(k))}</td><td>${h(fmtDur(s))}</td></tr>`).join("")}</tbody></table>`:`<p class="muted sm">Sem prática neste período.</p>`}</details></div>
  </section>`;
}
function mastery(){
  const rows=MODULES.map(M=>{
    const ids=LESSONS.filter(L=>L.m===M.id).flatMap(L=>lessonItems(L).map(i=>i.id)), n=ids.length;
    const known=ids.filter(id=>(S.prog.srs[id]||{}).b>=3).length, learned=ids.filter(id=>S.prog.srs[id]).length;
    const done=LESSONS.filter(L=>L.m===M.id && S.prog.lessons[L.id]).length;
    const tip=`${M.pt}: ${known} na memória, ${learned} aprendidas, de ${n} frases`;
    return `<div class="mrow" tabindex="0" data-tip="${h(tip)}"><span class="mr-name"><span class="sw sm">${stoneSVG(M.stone, 40, 40, M.n)}</span><span><b lang="fr">${h(M.fr)}</b><small>${done}/4 lições</small></span></span><span class="mr-bar" role="img" aria-label="${h(tip)}"><i class="lr" style="width:${(100*learned/n).toFixed(1)}%"></i><i class="kn" style="width:${(100*known/n).toFixed(1)}%"></i></span><span class="mr-val">${known}<small>/${n}</small></span></div>`;
  }).join("");
  return `<section class="card chart-card"><div class="sec-head"><h2 class="sec-title">Frases por módulo</h2></div>
    <div class="legend"><span><i class="k-kn"></i>Na memória · revistas com sucesso pelo menos duas vezes</span><span><i class="k-lr"></i>Aprendidas</span></div>
    ${rows}</section>`;
}
function historyList(){
  const list=S.prog.history.slice(0,14);
  if(!list.length) return "";
  const label=e=>{ const L=LESSON_BY_ID[e.id];
    if(e.k==="lesson" && L) return `Lição ${pad2(L.n)} · <span lang="fr">${frHtml(L.fr)}</span>`;
    if(e.k==="dialogue" && L) return `Diálogo da lição ${pad2(L.n)}`;
    if(e.k==="review") return `Revisão · ${e.n} ${e.n===1?"frase":"frases"}${e.ok!=null?`, ${e.ok} sabidas`:""}`;
    if(e.k==="practice") return `Treino livre · ${e.n} frases`;
    return "Prática"; };
  return `<section class="card"><div class="sec-head"><h2 class="sec-title">Histórico</h2></div><ul class="hist">${list.map(e=>`<li><span class="h-d">${h(relDayShort(dayKey(e.d)))}</span><span class="h-t">${label(e)}</span><span class="h-m">${h(fmtDur(e.sec||0))}</span></li>`).join("")}</ul></section>`;
}
function relDayShort(k){ const d=daysBetween(k, today()); return d===0?"Hoje":d===1?"Ontem":ptShort(k); }

/* ---------- Overlay host (lesson player, review, welcome) ---------- */
const Ov = {
  kind:null,
  show(kind, html){ this.kind=kind; const o=$("#ov"); o.className="ov ov-"+kind; o.innerHTML=html; o.hidden=false; o.scrollTop=0; document.body.classList.add("locked"); Nav.later(); },
  hide(){ const o=$("#ov"); o.hidden=true; o.innerHTML=""; this.kind=null; document.body.classList.remove("locked"); Nav.later(); }
};
const DIAL = {
  prof:["Professeur","O professor"], read:["Lisez","Lê"], listen:["Écoutez","Ouve"], answer:["À vous","Responde"],
  repeat:["Répétez","Repete"], paused:["Pause","Em pausa"], done:["Terminé","Concluído"], grade:["Alors ?","Como correu?"], mic:["Je vous écoute","A ouvir-te"]
};
function dialHtml(stone, seed){
  return `<div class="dial" id="dial" data-state="paused"><div class="d-stone">${stoneSVG(stone, 200, 200, seed)}</div><span class="d-pulse"></span><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="d-track" cx="100" cy="100" r="94"/><circle class="d-arc" id="d-arc" cx="100" cy="100" r="94" pathLength="100"/></svg><div class="d-label" aria-live="polite"><b id="d-fr" lang="fr"></b><small id="d-pt"></small></div></div>`;
}
function setDial(state, ms){
  const d=$("#dial"); if(!d) return;
  d.dataset.state=state;
  const [fr,pt]=DIAL[state]||["",""]; $("#d-fr").textContent=fr; $("#d-pt").textContent=pt;
